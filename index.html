<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המישמות שלנו v1.0.3</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="המישמות שלנו">

    <!-- (ברוחב גבוהה) לוגו ואייקון מותאם אישית למסך הבית -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%234f46e5'/><text x='50%ிற' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='250' fill='white'>V</text></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%234f46e5'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='250' fill='white'>V</text></svg>">

    <!-- (PWA Manifest) הגדרות אפליקציה להתקנה -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"המישמות שלנו","short_name":"המישמות","start_url":"./index.html","display":"standalone","background_color":"%23f3f4f6","theme_color":"%234f46e5","icons":[{"src":"data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'><rect width=\'512\' height=\'512\' rx=\'100\' fill=\'\%234f46e5\'/></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 min-h-screen pb-20">

    <!-- כותרת ותאריך -->
    <header class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center mb-4 relative">
        <span class="absolute top-2 left-3 text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">v1.0.3</span>
        <h1 class="text-2xl font-bold text-gray-800 mb-1">המישמות שלנו</h1>
        <div id="current-date" class="text-xs font-bold text-indigo-600 mb-2"></div>

        <!-- מחוון חשבון / קוד משפחתי -->
        <div class="inline-flex items-center gap-2 bg-indigo-50 border border-indigo-100 text-indigo-800 text-xs px-3 py-1 rounded-full">
            <span>חשבון:</span>
            <strong id="display-group-name">...</strong>
        </div>
        <div>
            <button onclick="switchUserGroup()" class="text-[10px] text-indigo-600 underline hover:text-indigo-900 mt-1">החלף קוד משפחתי</button>
        </div>

        <!-- כפתור להתקנת האפליקציה בלחיצה אחת -->
        <div class="mt-3">
            <button id="install-pwa-btn" onclick="installPWA()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-4 py-2 rounded-xl shadow-sm transition-all items-center justify-center gap-2 mx-auto">
                📥 התקן את האפליקציה למכשיר
            </button>
        </div>
    </header>

    <!-- באנר משימות להיום -->
    <div id="today-banner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-4 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-lg">🔔</span>
            <span id="today-banner-text" class="text-xs font-bold text-amber-900"></span>
        </div>
        <button onclick="closeTodayBanner()" class="text-amber-700 hover:text-amber-900 text-xs font-bold px-2 py-1">✕</button>
    </div>

    <!-- שאר מבנה האפליקציה והלוגיקה שלך תואמים להמשך הקוד הרגיל -->

    <script>
        // רישום Service Worker להתקנת PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        // ניהול התקנת PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('install-pwa-btn');
            if (installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex');
            }
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        const installBtn = document.getElementById('install-pwa-btn');
                        if (installBtn) installBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>
</body>
</html>

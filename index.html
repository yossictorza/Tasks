<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המשימות שלנו</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="המשימות שלנו">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="max-w-md mx-auto p-4 min-h-screen pb-20">

  <!-- כותרת ותאריך -->
  <header class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center mb-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">המשימות שלנו 📋</h1>
    <div id="current-date" class="text-xs font-bold text-indigo-600"></div>
  </header>

  <!-- באנר משימות להיום -->
  <div id="today-banner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-3.5 mb-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-bold text-amber-900 flex items-center gap-1">
        ⭐ משימות להיום (<span id="today-date-text"></span>)
      </span>
      <span id="today-count" class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-bold">0</span>
    </div>
    <div id="today-tasks-list" class="space-y-1.5"></div>
  </div>

  <!-- טופס הוספת משימה -->
  <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">
    <h2 class="text-base font-bold text-gray-700 mb-3">➕ הוספת משימה חדשה</h2>
    
    <div class="space-y-3">
      <input type="text" id="task-title" placeholder="מה צריך לעשות / לקנות?" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-indigo-500">
      
      <div class="grid grid-cols-2 gap-2">
        <!-- קטגוריה ראשית -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-500">קטגוריה ראשית</label>
            <div class="flex gap-1.5 text-[10px]">
              <button type="button" onclick="openAddModal('category')" class="text-indigo-600 font-bold hover:underline">+ הוסף</button>
              <button type="button" onclick="openDeleteModal('category')" class="text-red-500 font-bold hover:underline">🗑️</button>
            </div>
          </div>
          <select id="task-category" onchange="onCategorySelectChange()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm"></select>
        </div>

        <!-- אחראי/ת -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-500">אחראי/ת</label>
            <div class="flex gap-1.5 text-[10px]">
              <button type="button" onclick="openAddModal('assignee')" class="text-indigo-600 font-bold hover:underline">+ הוסף</button>
              <button type="button" onclick="openDeleteModal('assignee')" class="text-red-500 font-bold hover:underline">🗑️</button>
            </div>
          </div>
          <select id="task-assignee" onchange="onAssigneeSelectChange()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm"></select>
        </div>
      </div>

      <!-- מתג הפעלת תאריך עברי -->
      <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 space-y-2">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-bold text-gray-700 flex items-center gap-1.5">
            📅 הגדר תאריך עברי למשימה
          </span>
          <input type="checkbox" id="task-enable-date" onchange="onDateSwitchChange()" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
        </label>

        <!-- בחירת תאריך עברי -->
        <div id="task-date-picker-box" class="hidden grid grid-cols-3 gap-1.5 pt-1 border-t border-gray-200/60">
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">יום</label>
            <select id="task-heb-day" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">חודש</label>
            <select id="task-heb-month" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">שנה</label>
            <select id="task-heb-year" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
        </div>
      </div>

      <!-- קטגוריה / חנות -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs text-gray-500">קטגוריה / חנות (רשות)</label>
          <div class="flex gap-1.5 text-[10px]">
            <button type="button" onclick="openAddModal('subcategory')" class="text-indigo-600 font-bold hover:underline">+ הוסף קטגוריה</button>
            <button type="button" onclick="openDeleteModal('subcategory')" class="text-red-500 font-bold hover:underline">🗑️</button>
          </div>
        </div>
        <select id="task-subcategory" onchange="onSubcategorySelectChange()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm"></select>
      </div>

      <button onclick="addTask()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">
        הוסף משימה
      </button>
    </div>
  </section>

  <!-- סרגלי סינון -->
  <div class="space-y-2 mb-4">
    <!-- סרגל קטגוריות ראשיות -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="category-filter-bar"></div>

    <!-- סרגל אחראי -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="assignee-filter-bar"></div>

    <!-- סרגל קטגוריות משניות -->
    <div id="subcategory-filter-bar" class="hidden flex items-center gap-1.5 overflow-x-auto pb-1">
      <span class="text-xs text-gray-400 pl-1 font-medium whitespace-nowrap">קטגוריה:</span>
      <div id="subcategory-filter-buttons" class="flex gap-1.5 overflow-x-auto"></div>
    </div>
  </div>

  <!-- רשימת המשימות -->
  <main id="tasks-container" class="space-y-3"></main>

  <!-- מודאל הוספת פריט עם אימוג'ים -->
  <div id="add-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl space-y-3">
      <h3 id="add-modal-title" class="text-sm font-bold text-gray-800"></h3>
      
      <div>
        <label class="block text-xs text-gray-500 mb-1">בחר אימוג'י להצעה:</label>
        <div id="emoji-picker" class="flex flex-wrap gap-1.5 p-2 bg-gray-50 rounded-xl border border-gray-100 max-h-28 overflow-y-auto"></div>
      </div>

      <div>
        <label class="block text-xs text-gray-500 mb-1">שם:</label>
        <input type="text" id="add-modal-input" class="w-full p-2 border border-gray-200 rounded-xl text-sm outline-none focus:border-indigo-500">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddModal()" class="px-3 py-1.5 text-xs font-bold text-gray-500 bg-gray-100 rounded-xl">ביטול</button>
        <button onclick="confirmAddModal()" class="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 rounded-xl">אישור</button>
      </div>
    </div>
  </div>

  <!-- מודאל מחיקת פריטים בלחיצה מתוך רשימה -->
  <div id="delete-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="delete-modal-title" class="text-sm font-bold text-gray-800">לחץ על מה שברצונך למחוק:</h3>
        <button onclick="closeDeleteModal()" class="text-gray-400 hover:text-gray-600 font-bold text-sm">✕</button>
      </div>
      
      <div id="delete-modal-list" class="space-y-1.5 max-h-60 overflow-y-auto pt-1"></div>

      <div class="flex justify-end pt-2">
        <button onclick="closeDeleteModal()" class="px-3 py-1.5 text-xs font-bold text-gray-500 bg-gray-100 rounded-xl">סגור</button>
      </div>
    </div>
  </div>

<script>
  const HEBREW_DAYS_LIST = [
    "", "א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ז'", "ח'", "ט'", "י'",
    'י"א', 'י"ב', 'י"ג', 'י"ד', 'ט"ו', 'ט"ז', 'י"ז', 'י"ח', 'י"ט', "כ'",
    'כ"א', 'כ"ב', 'כ"ג', 'כ"ד', 'כ"ה', 'כ"ו', 'כ"ז', 'כ"ח', 'כ"ט', "ל'"
  ];

  const HEBREW_MONTHS_LIST = [
    { name: 'תשרי', code: 1 },
    { name: 'חשוון', code: 2 },
    { name: 'כסלו', code: 3 },
    { name: 'טבת', code: 4 },
    { name: 'שבט', code: 5 },
    { name: 'אדר', code: 6 },
    { name: 'אדר א\'', code: 6.1 },
    { name: 'אדר ב\'', code: 6.2 },
    { name: 'ניסן', code: 7 },
    { name: 'אייר', code: 8 },
    { name: 'סיוון', code: 9 },
    { name: 'תמוז', code: 10 },
    { name: 'אב', code: 11 },
    { name: 'אלול', code: 12 }
  ];

  const HEBREW_YEARS_LIST = [
    { num: 5785, text: 'תשפ"ה' },
    { num: 5786, text: 'תשפ"ו' },
    { num: 5787, text: 'תשפ"ז' },
    { num: 5788, text: 'תשפ"ח' },
    { num: 5789, text: 'תשפ"ט' },
    { num: 5790, text: 'תש"צ' }
  ];

  function toHebrewYear(yearNum) {
    const yObj = HEBREW_YEARS_LIST.find(y => y.num === yearNum);
    return yObj ? yObj.text : yearNum.toString();
  }

  function getTodayHebrewData() {
    try {
      const formatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' });
      const parts = formatter.formatToParts(new Date());
      let day = 1, monthName = 'תשרי', year = 5787;
      for (const p of parts) {
        if (p.type === 'day') day = parseInt(p.value, 10);
        if (p.type === 'month') monthName = p.value;
        if (p.type === 'year') year = parseInt(p.value, 10);
      }
      
      let matchedMonth = HEBREW_MONTHS_LIST.find(m => monthName.includes(m.name)) || HEBREW_MONTHS_LIST[0];
      const dayHeb = HEBREW_DAYS_LIST[day] || day + "'";
      const yearHeb = toHebrewYear(year);
      const dateDisplay = `${dayHeb} ב${matchedMonth.name} ${yearHeb}`;
      const sortKey = Math.floor(year * 10000 + matchedMonth.code * 100 + day);

      return { day, monthCode: matchedMonth.code, monthName: matchedMonth.name, year, dayHeb, yearHeb, dateDisplay, sortKey };
    } catch(e) {
      return { day: 1, monthCode: 1, monthName: 'תשרי', year: 5787, dayHeb: "א'", yearHeb: 'תשפ"ז', dateDisplay: "א' בתשרי תשפ\"ז", sortKey: 57870101 };
    }
  }

  const todayHeb = getTodayHebrewData();

  // טעינת נתונים שמורים
  let categories = JSON.parse(localStorage.getItem('app_categories')) || ['🛒 קניות', '🏠 מטלות בית', '⏰ תזכורות'];
  let assignees = JSON.parse(localStorage.getItem('app_assignees')) || ['👫 שנינו', '👨 יוסי', '👩 אסתי'];
  let subcategories = JSON.parse(localStorage.getItem('app_subcategories')) || [];

  let rawTasks = JSON.parse(localStorage.getItem('app_tasks')) || [];
  let tasks = rawTasks.map(t => ({
    ...t,
    hebrewDateDisplay: t.hebrewDateDisplay || t.hebrewDate || null,
    hebrewSortKey: t.hebrewSortKey || null
  }));

  let activeCategory = 'הכל';
  let activeAssignee = 'הכל';
  let activeSubcategory = 'הכל';

  let currentAddType = null;
  let currentDeleteType = null;

  const CATEGORY_EMOJIS = ['🛒', '🏠', '⏰', '🧹', '📦', '🚗', '💼', '🍕', '💊', '🛠️', '📌', '⭐', '📝', '🍞', '🥩', '🧼'];
  const ASSIGNEE_EMOJIS = ['👨', '👩', '👫', '👤', '🧑', '👧', '👦', '👵', '👴', '⭐'];

  function saveData() {
    localStorage.setItem('app_categories', JSON.stringify(categories));
    localStorage.setItem('app_assignees', JSON.stringify(assignees));
    localStorage.setItem('app_subcategories', JSON.stringify(subcategories));
    localStorage.setItem('app_tasks', JSON.stringify(tasks));
  }

  // כותרת תאריך
  const gregDate = new Date().toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('current-date').innerText = `${gregDate} | ${todayHeb.dateDisplay}`;

  function initHebrewDateDropdowns(dayElemId, monthElemId, yearElemId, defaultDay=todayHeb.day, defaultMonth=todayHeb.monthCode, defaultYear=todayHeb.year) {
    const daySelect = document.getElementById(dayElemId);
    const monthSelect = document.getElementById(monthElemId);
    const yearSelect = document.getElementById(yearElemId);

    if (daySelect) {
      daySelect.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = HEBREW_DAYS_LIST[i];
        if (i == defaultDay) opt.selected = true;
        daySelect.appendChild(opt);
      }
    }

    if (monthSelect) {
      monthSelect.innerHTML = '';
      HEBREW_MONTHS_LIST.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.code;
        opt.innerText = m.name;
        if (m.code == defaultMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      });
    }

    if (yearSelect) {
      yearSelect.innerHTML = '';
      HEBREW_YEARS_LIST.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y.num;
        opt.innerText = y.text;
        if (y.num == defaultYear) opt.selected = true;
        yearSelect.appendChild(opt);
      });
    }
  }

  function onDateSwitchChange() {
    const chk = document.getElementById('task-enable-date');
    const box = document.getElementById('task-date-picker-box');
    if (chk.checked) {
      box.classList.remove('hidden');
      initHebrewDateDropdowns('task-heb-day', 'task-heb-month', 'task-heb-year', todayHeb.day, todayHeb.monthCode, todayHeb.year);
    } else {
      box.classList.add('hidden');
    }
  }

  /* --- מודאלים דינמיים להוספה ומחיקה --- */
  function openAddModal(type) {
    currentAddType = type;
    const modal = document.getElementById('add-modal');
    const title = document.getElementById('add-modal-title');
    const picker = document.getElementById('emoji-picker');
    const input = document.getElementById('add-modal-input');

    input.value = '';
    picker.innerHTML = '';

    let emojis = CATEGORY_EMOJIS;
    if (type === 'category') {
      title.innerText = '➕ הוספת קטגוריה ראשית';
    } else if (type === 'assignee') {
      title.innerText = '➕ הוספת אחראי/ת';
      emojis = ASSIGNEE_EMOJIS;
    } else if (type === 'subcategory') {
      const parentCategory = document.getElementById('task-category').value;
      title.innerText = `➕ הוספת קטגוריה עבור "${parentCategory}"`;
    }

    emojis.forEach(emoji => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'text-lg p-1.5 hover:bg-gray-200 rounded-lg transition cursor-pointer';
      btn.innerText = emoji;
      btn.onclick = () => {
        if (!input.value.startsWith(emoji)) {
          input.value = emoji + ' ' + input.value.replace(/^[^\s]+\s/, '');
        }
      };
      picker.appendChild(btn);
    });

    modal.classList.remove('hidden');
    input.focus();
  }

  function closeAddModal() {
    document.getElementById('add-modal').classList.add('hidden');
    updateCategoryDropdown();
    updateAssigneeDropdown();
    updateSubcategoryDropdown();
  }

  function confirmAddModal() {
    const val = document.getElementById('add-modal-input').value.trim();
    if (!val) {
      alert('נא להזין שם');
      return;
    }

    if (currentAddType === 'category') {
      if (!categories.includes(val)) {
        categories.push(val);
        saveData();
      }
      updateCategoryDropdown();
      document.getElementById('task-category').value = val;
      renderCategoryFilterBar();
      updateSubcategoryDropdown();
    } else if (currentAddType === 'assignee') {
      if (!assignees.includes(val)) {
        assignees.push(val);
        saveData();
      }
      updateAssigneeDropdown();
      document.getElementById('task-assignee').value = val;
      renderAssigneeFilterBar();
    } else if (currentAddType === 'subcategory') {
      const parentCategory = document.getElementById('task-category').value;
      subcategories.push({
        id: Date.now().toString(),
        name: val,
        parentCategory: parentCategory
      });
      saveData();
      updateSubcategoryDropdown();
      document.getElementById('task-subcategory').value = val;
      updateSubcategoryFilterBar();
      render();
    }

    document.getElementById('add-modal').classList.add('hidden');
  }

  function openDeleteModal(type) {
    currentDeleteType = type;
    const modal = document.getElementById('delete-modal');
    const list = document.getElementById('delete-modal-list');
    const title = document.getElementById('delete-modal-title');
    list.innerHTML = '';

    let items = [];
    if (type === 'category') {
      title.innerText = 'לחץ על קטגוריה ראשית למחיקה:';
      items = categories.map(c => ({ id: c, name: c }));
    } else if (type === 'assignee') {
      title.innerText = 'לחץ על אחראי/ת למחיקה:';
      items = assignees.map(a => ({ id: a, name: a }));
    } else if (type === 'subcategory') {
      const parentCategory = document.getElementById('task-category').value;
      title.innerText = `לחץ על קטגוריה למחיקה (תחת "${parentCategory}"):`;
      items = subcategories.filter(s => s.parentCategory === parentCategory).map(s => ({ id: s.id, name: s.name, parentCategory: s.parentCategory }));
    }

    if (items.length === 0) {
      list.innerHTML = '<div class="text-xs text-gray-400 p-2 text-center">אין פריטים ברשימה למחיקה</div>';
    } else {
      items.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full flex justify-between items-center p-2.5 rounded-xl bg-red-50 hover:bg-red-100 border border-red-100 text-red-700 text-xs font-bold transition text-right cursor-pointer';
        btn.innerHTML = `<span>${item.name}</span><span class="text-red-500 font-normal">🗑️ מחק</span>`;
        btn.onclick = () => {
          deleteItemFromModal(type, item);
        };
        list.appendChild(btn);
      });
    }

    modal.classList.remove('hidden');
  }

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.add('hidden');
    updateCategoryDropdown();
    updateAssigneeDropdown();
    updateSubcategoryDropdown();
  }

  function deleteItemFromModal(type, item) {
    if (confirm(`האם למחוק את "${item.name}"?`)) {
      if (type === 'category') {
        categories = categories.filter(c => c !== item.id);
        subcategories = subcategories.filter(s => s.parentCategory !== item.id);
        tasks = tasks.filter(t => t.category !== item.id);
        if (activeCategory === item.id) activeCategory = 'הכל';
        saveData();
        updateCategoryDropdown();
        renderCategoryFilterBar();
        updateSubcategoryDropdown();
        updateSubcategoryFilterBar();
        render();
      } else if (type === 'assignee') {
        assignees = assignees.filter(a => a !== item.id);
        tasks = tasks.map(t => t.assignee === item.id ? { ...t, assignee: 'שנינו' } : t);
        if (activeAssignee === item.id) activeAssignee = 'הכל';
        saveData();
        updateAssigneeDropdown();
        renderAssigneeFilterBar();
        render();
      } else if (type === 'subcategory') {
        subcategories = subcategories.filter(s => s.id !== item.id);
        tasks = tasks.filter(t => !(t.category === item.parentCategory && t.subcategory === item.name));
        if (activeSubcategory === item.name) activeSubcategory = 'הכל';
        saveData();
        updateSubcategoryDropdown();
        updateSubcategoryFilterBar();
        render();
      }
      openDeleteModal(type);
    }
  }

  /* --- ניהול קטגוריות ראשיות --- */
  function updateCategoryDropdown() {
    const sel = document.getElementById('task-category');
    if (!sel) return;
    const curVal = sel.value;
    sel.innerHTML = '';
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.innerText = c;
      sel.appendChild(opt);
    });
    const addOpt = document.createElement('option');
    addOpt.value = '__ADD_CAT__';
    addOpt.innerText = '➕ הוסף קטגוריה חדשה...';
    sel.appendChild(addOpt);

    const delOpt = document.createElement('option');
    delOpt.value = '__DEL_CAT__';
    delOpt.innerText = '🗑️ מחק קטגוריה...';
    sel.appendChild(delOpt);

    if (categories.includes(curVal)) sel.value = curVal;
  }

  function onCategorySelectChange() {
    const val = document.getElementById('task-category').value;
    if (val === '__ADD_CAT__') {
      openAddModal('category');
    } else if (val === '__DEL_CAT__') {
      openDeleteModal('category');
    } else {
      updateSubcategoryDropdown();
    }
  }

  /* --- ניהול אחראים --- */
  function updateAssigneeDropdown() {
    const sel = document.getElementById('task-assignee');
    if (!sel) return;
    const curVal = sel.value;
    sel.innerHTML = '';
    assignees.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a;
      opt.innerText = a;
      sel.appendChild(opt);
    });
    const addOpt = document.createElement('option');
    addOpt.value = '__ADD_ASS__';
    addOpt.innerText = '➕ הוסף אחראי/ת...';
    sel.appendChild(addOpt);

    const delOpt = document.createElement('option');
    delOpt.value = '__DEL_ASS__';
    delOpt.innerText = '🗑️ מחק אחראי/ת...';
    sel.appendChild(delOpt);

    if (assignees.includes(curVal)) sel.value = curVal;
  }

  function onAssigneeSelectChange() {
    const val = document.getElementById('task-assignee').value;
    if (val === '__ADD_ASS__') {
      openAddModal('assignee');
    } else if (val === '__DEL_ASS__') {
      openDeleteModal('assignee');
    }
  }

  /* --- ניהול קטגוריות משניות --- */
  function updateSubcategoryDropdown() {
    const selectedCat = document.getElementById('task-category').value;
    const subSelect = document.getElementById('task-subcategory');
    subSelect.innerHTML = '<option value="כללי">כללי (ללא קטגוריה נוספת)</option>';

    const filteredSubs = subcategories.filter(s => s.parentCategory === selectedCat);
    filteredSubs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.innerText = s.name;
      subSelect.appendChild(opt);
    });

    const addOpt = document.createElement('option');
    addOpt.value = '__ADD_SUB__';
    addOpt.innerText = '➕ הוסף קטגוריה חדשה...';
    subSelect.appendChild(addOpt);

    const delOpt = document.createElement('option');
    delOpt.value = '__DEL_SUB__';
    delOpt.innerText = '🗑️ מחק קטגוריה...';
    subSelect.appendChild(delOpt);
  }

  function onSubcategorySelectChange() {
    const val = document.getElementById('task-subcategory').value;
    if (val === '__ADD_SUB__') {
      openAddModal('subcategory');
    } else if (val === '__DEL_SUB__') {
      openDeleteModal('subcategory');
    }
  }

  /* --- סרגלי סינון --- */
  function renderCategoryFilterBar() {
    const bar = document.getElementById('category-filter-bar');
    if (!bar) return;
    bar.innerHTML = '';

    const allBtn = createFilterButton('הכל', activeCategory === 'הכל', (btn) => setCategoryFilter('הכל', btn));
    bar.appendChild(allBtn);

    const dateBtn = createFilterButton('📅 עם תאריך', activeCategory === '📅 עם תאריך', (btn) => setCategoryFilter('📅 עם תאריך', btn));
    bar.appendChild(dateBtn);

    categories.forEach(c => {
      const btn = createFilterButton(c, activeCategory === c, (b) => setCategoryFilter(c, b));
      bar.appendChild(btn);
    });
  }

  function renderAssigneeFilterBar() {
    const bar = document.getElementById('assignee-filter-bar');
    if (!bar) return;
    bar.innerHTML = '';

    const label = document.createElement('span');
    label.className = 'text-xs text-gray-400 pl-1 font-medium whitespace-nowrap';
    label.innerText = 'אחראי:';
    bar.appendChild(label);

    const allBtn = createFilterButton('הכל', activeAssignee === 'הכל', (btn) => setAssigneeFilter('הכל', btn), 'ass');
    bar.appendChild(allBtn);

    assignees.forEach(a => {
      const btn = createFilterButton(a, activeAssignee === a, (b) => setAssigneeFilter(a, b), 'ass');
      bar.appendChild(btn);
    });
  }

  function updateSubcategoryFilterBar() {
    const barBox = document.getElementById('subcategory-filter-bar');
    const buttonsBox = document.getElementById('subcategory-filter-buttons');
    if (!barBox || !buttonsBox) return;

    let relevantSubs = [];
    if (activeCategory === 'הכל' || activeCategory === '📅 עם תאריך') {
      relevantSubs = subcategories;
    } else {
      relevantSubs = subcategories.filter(s => s.parentCategory === activeCategory);
    }

    if (relevantSubs.length === 0) {
      barBox.classList.add('hidden');
      activeSubcategory = 'הכל';
      return;
    }

    barBox.classList.remove('hidden');
    buttonsBox.innerHTML = '';

    const allBtn = createFilterButton('הכל', activeSubcategory === 'הכל', () => {
      activeSubcategory = 'הכל';
      updateSubcategoryFilterBar();
      render();
    });
    buttonsBox.appendChild(allBtn);

    relevantSubs.forEach(s => {
      const btn = createFilterButton(s.name, activeSubcategory === s.name, () => {
        activeSubcategory = s.name;
        updateSubcategoryFilterBar();
        render();
      });
      buttonsBox.appendChild(btn);
    });
  }

  function createFilterButton(text, isActive, onClick, type='cat') {
    const btn = document.createElement('button');
    let activeClasses = 'bg-indigo-600 text-white shadow-sm';
    if (type === 'ass') activeClasses = 'bg-gray-700 text-white';

    btn.className = `${type}-filter-btn ${isActive ? activeClasses : 'bg-white text-gray-600 border border-gray-200'} px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition cursor-pointer`;
    btn.innerText = text;
    btn.onclick = () => onClick(btn);
    return btn;
  }

  function setCategoryFilter(cat, btn) {
    activeCategory = cat;
    activeSubcategory = 'הכל';
    renderCategoryFilterBar();
    updateSubcategoryFilterBar();
    render();
  }

  function setAssigneeFilter(ass, btn) {
    activeAssignee = ass;
    renderAssigneeFilterBar();
    render();
  }

  /* --- הוספת משימה --- */
  function addTask() {
    const title = document.getElementById('task-title').value.trim();
    const category = document.getElementById('task-category').value;
    const assignee = document.getElementById('task-assignee').value;
    const subcategory = document.getElementById('task-subcategory').value;
    const hasDate = document.getElementById('task-enable-date').checked;

    if (!title) return alert('נא להזין תיאור משימה');

    let hebDateDisplay = null;
    let hebSortKey = null;
    let dayVal = null, monthVal = null, yearVal = null;

    if (hasDate) {
      dayVal = parseInt(document.getElementById('task-heb-day').value) || todayHeb.day;
      monthVal = parseFloat(document.getElementById('task-heb-month').value) || todayHeb.monthCode;
      yearVal = parseInt(document.getElementById('task-heb-year').value) || todayHeb.year;

      const monthObj = HEBREW_MONTHS_LIST.find(m => m.code === monthVal) || HEBREW_MONTHS_LIST[0];
      hebDateDisplay = `${HEBREW_DAYS_LIST[dayVal]} ב${monthObj.name} ${toHebrewYear(yearVal)}`;
      hebSortKey = Math.floor(yearVal * 10000 + monthVal * 100 + dayVal);
    }

    tasks.push({
      id: Date.now().toString(),
      title,
      category,
      assignee,
      subcategory,
      hebrewDateDisplay: hebDateDisplay,
      hebrewSortKey: hebSortKey,
      hebDay: dayVal,
      hebMonth: monthVal,
      hebYear: yearVal,
      completed: false
    });

    saveData();
    document.getElementById('task-title').value = '';
    document.getElementById('task-enable-date').checked = false;
    document.getElementById('task-date-picker-box').classList.add('hidden');
    updateSubcategoryFilterBar();
    render();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveData();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveData();
    render();
  }

  function toggleEdit(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, isEditing: !t.isEditing } : t);
    render();
    const task = tasks.find(t => t.id === id);
    if (task && task.isEditing) {
      const hasDate = !!task.hebrewSortKey;
      const chk = document.getElementById(`edit-enable-date-${id}`);
      if (chk) chk.checked = hasDate;
      if (hasDate) {
        document.getElementById(`edit-date-box-${id}`).classList.remove('hidden');
        initHebrewDateDropdowns(`edit-heb-day-${id}`, `edit-heb-month-${id}`, `edit-heb-year-${id}`, task.hebDay || todayHeb.day, task.hebMonth || todayHeb.monthCode, task.hebYear || todayHeb.year);
      }
    }
  }

  function onEditDateSwitchChange(id) {
    const chk = document.getElementById(`edit-enable-date-${id}`);
    const box = document.getElementById(`edit-date-box-${id}`);
    if (chk.checked) {
      box.classList.remove('hidden');
      initHebrewDateDropdowns(`edit-heb-day-${id}`, `edit-heb-month-${id}`, `edit-heb-year-${id}`, todayHeb.day, todayHeb.monthCode, todayHeb.year);
    } else {
      box.classList.add('hidden');
    }
  }

  function saveEdit(id) {
    const newTitle = document.getElementById(`edit-title-${id}`).value.trim();
    const newAssignee = document.getElementById(`edit-assignee-${id}`).value;
    const hasDate = document.getElementById(`edit-enable-date-${id}`).checked;

    if (!newTitle) return;

    let hebDateDisplay = null;
    let hebSortKey = null;
    let dayVal = null, monthVal = null, yearVal = null;

    if (hasDate) {
      dayVal = parseInt(document.getElementById(`edit-heb-day-${id}`).value) || todayHeb.day;
      monthVal = parseFloat(document.getElementById(`edit-heb-month-${id}`).value) || todayHeb.monthCode;
      yearVal = parseInt(document.getElementById(`edit-heb-year-${id}`).value) || todayHeb.year;

      const monthObj = HEBREW_MONTHS_LIST.find(m => m.code === monthVal) || HEBREW_MONTHS_LIST[0];
      hebDateDisplay = `${HEBREW_DAYS_LIST[dayVal]} ב${monthObj.name} ${toHebrewYear(yearVal)}`;
      hebSortKey = Math.floor(yearVal * 10000 + monthVal * 100 + dayVal);
    }

    tasks = tasks.map(t => t.id === id ? {
      ...t,
      title: newTitle,
      assignee: newAssignee,
      hebrewDateDisplay: hebDateDisplay,
      hebrewSortKey: hebSortKey,
      hebDay: dayVal,
      hebMonth: monthVal,
      hebYear: yearVal,
      isEditing: false
    } : t);

    saveData();
    render();
  }

  function sortTasks(taskList) {
    return taskList.sort((a, b) => {
      if (a.hebrewSortKey && b.hebrewSortKey) {
        return a.hebrewSortKey - b.hebrewSortKey;
      }
      if (a.hebrewSortKey && !b.hebrewSortKey) return -1;
      if (!a.hebrewSortKey && b.hebrewSortKey) return 1;
      return 0;
    });
  }

  function updateTodayBanner() {
    const todayBanner = document.getElementById('today-banner');
    const todayList = document.getElementById('today-tasks-list');
    const todayCount = document.getElementById('today-count');
    const todayDateText = document.getElementById('today-date-text');

    const todayTasks = tasks.filter(t => t.hebrewSortKey === todayHeb.sortKey && !t.completed);

    if (todayTasks.length === 0) {
      todayBanner.classList.add('hidden');
      return;
    }

    todayBanner.classList.remove('hidden');
    todayDateText.innerText = todayHeb.dateDisplay;
    todayCount.innerText = todayTasks.length;
    todayList.innerHTML = '';

    todayTasks.forEach(t => {
      const item = document.createElement('div');
      item.className = 'flex items-center justify-between text-xs font-semibold text-amber-900 bg-white/80 p-2 rounded-lg border border-amber-200/60';
      item.innerHTML = `
        <div class="flex items-center gap-2">
          <input type="checkbox" onclick="toggleTask('${t.id}')" class="w-3.5 h-3.5 text-amber-600 rounded cursor-pointer">
          <span>${t.title}</span>
        </div>
        <span class="text-[10px] bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-bold">${t.assignee}</span>
      `;
      todayList.appendChild(item);
    });
  }

  function render() {
    updateTodayBanner();

    const container = document.getElementById('tasks-container');
    container.innerHTML = '';

    let filtered = tasks.filter(t => {
      let matchCat = false;
      if (activeCategory === 'הכל') {
        matchCat = true;
      } else if (activeCategory === '📅 עם תאריך') {
        matchCat = !!t.hebrewSortKey || !!t.hebrewDateDisplay;
      } else {
        matchCat = t.category === activeCategory;
      }

      const matchAss = activeAssignee === 'הכל' || t.assignee === activeAssignee;
      const matchSub = activeSubcategory === 'הכל' || t.subcategory === activeSubcategory;

      return matchCat && matchAss && matchSub;
    });

    filtered = sortTasks(filtered);

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">אין משימות להצגה</div>';
      return;
    }

    if (activeSubcategory !== 'הכל') {
      filtered.forEach(task => container.appendChild(createTaskCard(task)));
      return;
    }

    const generalTasks = filtered.filter(t => !t.subcategory || t.subcategory === 'כללי');
    if (generalTasks.length > 0) {
      if (activeCategory !== 'הכל' && activeCategory !== '📅 עם תאריך') {
        const genHeader = document.createElement('div');
        genHeader.className = 'text-xs font-bold text-gray-500 mb-1 px-1';
        genHeader.innerText = '📌 משימות כלליות';
        container.appendChild(genHeader);
      }
      generalTasks.forEach(task => container.appendChild(createTaskCard(task)));
    }

    const subGrouped = {};
    filtered.filter(t => t.subcategory && t.subcategory !== 'כללי').forEach(t => {
      const key = `${t.category}___${t.subcategory}`;
      if (!subGrouped[key]) subGrouped[key] = [];
      subGrouped[key].push(t);
    });

    for (const [groupKey, items] of Object.entries(subGrouped)) {
      const [catName, subName] = groupKey.split('___');

      const groupCard = document.createElement('div');
      groupCard.className = 'bg-gray-50 p-3 rounded-2xl border border-gray-200 space-y-2 mt-2';

      const header = document.createElement('div');
      header.className = 'flex justify-between items-center mb-1';
      header.innerHTML = `
        <span class="text-xs font-bold text-gray-700">📂 ${subName} ${activeCategory === 'הכל' ? `(${catName})` : ''}</span>
      `;
      groupCard.appendChild(header);

      items.forEach(task => groupCard.appendChild(createTaskCard(task)));
      container.appendChild(groupCard);
    }
  }

  function createTaskCard(task) {
    const card = document.createElement('div');
    const isToday = task.hebrewSortKey === todayHeb.sortKey;
    
    card.className = `bg-white p-3 rounded-xl shadow-sm border ${isToday ? 'border-amber-400 bg-amber-50/30' : 'border-gray-100'} flex items-center justify-between mb-1.5 ${task.completed ? 'opacity-50' : ''}`;

    if (task.isEditing) {
      card.innerHTML = `
        <div class="w-full space-y-2">
          <input type="text" id="edit-title-${task.id}" value="${task.title}" class="w-full p-1.5 border rounded-lg text-sm">
          <div class="grid grid-cols-2 gap-2">
            <select id="edit-assignee-${task.id}" class="p-1 border rounded-lg text-xs">
              ${assignees.map(a => `<option value="${a}" ${task.assignee === a ? 'selected' : ''}>${a}</option>`).join('')}
            </select>
            <div class="flex items-center gap-1">
              <input type="checkbox" id="edit-enable-date-${task.id}" onchange="onEditDateSwitchChange('${task.id}')">
              <label for="edit-enable-date-${task.id}" class="text-xs text-gray-600 cursor-pointer">משוייך לתאריך</label>
            </div>
          </div>
          <div id="edit-date-box-${task.id}" class="hidden grid grid-cols-3 gap-1">
            <select id="edit-heb-day-${task.id}" class="p-1 border rounded-lg text-xs"></select>
            <select id="edit-heb-month-${task.id}" class="p-1 border rounded-lg text-xs"></select>
            <select id="edit-heb-year-${task.id}" class="p-1 border rounded-lg text-xs"></select>
          </div>
          <button onclick="saveEdit('${task.id}')" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold">שמור</button>
        </div>
      `;
    } else {
      let badgeColor = 'bg-purple-100 text-purple-700';
      if (task.assignee === 'יוסי') badgeColor = 'bg-blue-100 text-blue-700';
      if (task.assignee === 'אסתי') badgeColor = 'bg-pink-100 text-pink-700';

      const dateText = task.hebrewDateDisplay || task.hebrewDate || null;

      card.innerHTML = `
        <div class="flex items-center gap-2.5 flex-1">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${task.id}')" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
          <div>
            <span class="text-sm ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'} font-medium block">${task.title}</span>
            <div class="flex gap-1 mt-0.5 flex-wrap">
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${badgeColor}">${task.assignee}</span>
              ${activeCategory === 'הכל' || activeCategory === '📅 עם תאריך' ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-bold">🏷️ ${task.category}</span>` : ''}
              ${dateText ? `<span class="text-[10px] px-2 py-0.5 rounded-full ${isToday ? 'bg-amber-100 text-amber-800 font-extrabold border border-amber-300' : 'bg-blue-50 text-blue-700 border border-blue-200'} font-bold">📅 ${dateText}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="flex gap-1">
          <button onclick="toggleEdit('${task.id}')" class="text-gray-400 hover:text-indigo-600 p-1 text-xs">✏️</button>
          <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-600 p-1 text-xs">🗑️</button>
        </div>
      `;
    }

    return card;
  }

  // אתחול ראשוני
  updateCategoryDropdown();
  updateAssigneeDropdown();
  updateSubcategoryDropdown();
  renderCategoryFilterBar();
  renderAssigneeFilterBar();
  updateSubcategoryFilterBar();
  render();
</script>
</body>
</html>

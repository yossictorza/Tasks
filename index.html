<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המשימות שלנו</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="המשימות שלנו">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="max-w-md mx-auto p-4 min-h-screen pb-20">

  <!-- כותרת ותאריך -->
  <header class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center mb-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">המשימות שלנו 📋</h1>
    <div id="current-date" class="text-xs font-bold text-indigo-600"></div>
  </header>

  <!-- באנר משימות להיום -->
  <div id="today-banner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-3.5 mb-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-bold text-amber-900 flex items-center gap-1">
        ⭐ משימות להיום (<span id="today-date-text"></span>)
      </span>
      <span id="today-count" class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-bold">0</span>
    </div>
    <div id="today-tasks-list" class="space-y-1.5"></div>
  </div>

  <!-- טופס הוספת משימה -->
  <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">
    <h2 class="text-base font-bold text-gray-700 mb-3">➕ הוספת משימה חדשה</h2>
    
    <div class="space-y-3">
      <input type="text" id="task-title" placeholder="מה צריך לעשות / לקנות?" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-indigo-500">
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">קטגוריה ראשית</label>
          <select id="task-category" onchange="onCategoryChange()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm">
            <option value="קניות">🛒 קניות</option>
            <option value="מטלות בית">🏠 מטלות בית</option>
            <option value="תזכורות">⏰ תזכורות</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">אחראי/ת</label>
          <select id="task-assignee" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm">
            <option value="שנינו">👫 שנינו</option>
            <option value="יוסי">👨 יוסי</option>
            <option value="אסתי">👩 אסתי</option>
          </select>
        </div>
      </div>

      <!-- מתג הפעלת תאריך עברי -->
      <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 space-y-2">
        <div class="flex items-center justify-between cursor-pointer" onclick="toggleTaskDateSwitch()">
          <span class="text-xs font-bold text-gray-700 flex items-center gap-1.5">
            📅 הגדר תאריך עברי למשימה
          </span>
          <input type="checkbox" id="task-enable-date" onchange="onDateSwitchChange()" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
        </div>

        <!-- בחירת תאריך עברי (מוסתר כברירת מחדל, נפתח עם תאריך היום) -->
        <div id="task-date-picker-box" class="hidden grid grid-cols-3 gap-1.5 pt-1 border-t border-gray-200/60">
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">יום</label>
            <select id="task-heb-day" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">חודש</label>
            <select id="task-heb-month" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">שנה</label>
            <select id="task-heb-year" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
        </div>
      </div>

      <!-- תת-קטגוריה -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs text-gray-500">תת-קטגוריה / חנות (רשות)</label>
          <button type="button" onclick="promptNewSubcategory()" class="text-[11px] text-indigo-600 font-bold hover:underline">+ צור תת-קטגוריה</button>
        </div>
        <select id="task-subcategory" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm">
          <option value="כללי">כללי (ללא תת-קטגוריה)</option>
        </select>
      </div>

      <button onclick="addTask()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">
        הוסף משימה
      </button>
    </div>
  </section>

  <!-- סרגלי סינון -->
  <div class="space-y-2 mb-4">
    <div class="flex gap-1.5 overflow-x-auto pb-1">
      <button onclick="setCategoryFilter('הכל', this)" class="cat-filter-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm whitespace-nowrap">הכל</button>
      <button onclick="setCategoryFilter('📅 עם תאריך', this)" class="cat-filter-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">📅 עם תאריך</button>
      <button onclick="setCategoryFilter('קניות', this)" class="cat-filter-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">🛒 קניות</button>
      <button onclick="setCategoryFilter('מטלות בית', this)" class="cat-filter-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">🏠 מטלות בית</button>
      <button onclick="setCategoryFilter('תזכורות', this)" class="cat-filter-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">⏰ תזכורות</button>
    </div>

    <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
      <span class="text-xs text-gray-400 pl-1 font-medium whitespace-nowrap">אחראי:</span>
      <button onclick="setAssigneeFilter('הכל', this)" class="ass-filter-btn active bg-gray-700 text-white px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap">הכל</button>
      <button onclick="setAssigneeFilter('שנינו', this)" class="ass-filter-btn bg-white text-gray-600 border border-gray-200 px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap">👫 שנינו</button>
      <button onclick="setAssigneeFilter('יוסי', this)" class="ass-filter-btn bg-white text-gray-600 border border-gray-200 px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap">👨 יוסי</button>
      <button onclick="setAssigneeFilter('אסתי', this)" class="ass-filter-btn bg-white text-gray-600 border border-gray-200 px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap">👩 אסתי</button>
    </div>
  </div>

  <!-- רשימת המשימות -->
  <main id="tasks-container" class="space-y-3"></main>

<script>
  // רשימות עבריות
  const HEBREW_DAYS_LIST = [
    "", "א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ז'", "ח'", "ט'", "י'",
    'י"א', 'י"ב', 'י"ג', 'י"ד', 'ט"ו', 'ט"ז', 'י"ז', 'י"ח', 'י"ט', "כ'",
    'כ"א', 'כ"ב', 'כ"ג', 'כ"ד', 'כ"ה', 'כ"ו', 'כ"ז', 'כ"ח', 'כ"ט', "ל'"
  ];

  const HEBREW_MONTHS_LIST = [
    { name: 'תשרי', code: 1 },
    { name: 'חשוון', code: 2 },
    { name: 'כסלו', code: 3 },
    { name: 'טבת', code: 4 },
    { name: 'שבט', code: 5 },
    { name: 'אדר', code: 6 },
    { name: 'אדר א\'', code: 6.1 },
    { name: 'אדר ב\'', code: 6.2 },
    { name: 'ניסן', code: 7 },
    { name: 'אייר', code: 8 },
    { name: 'סיוון', code: 9 },
    { name: 'תמוז', code: 10 },
    { name: 'אב', code: 11 },
    { name: 'אלול', code: 12 }
  ];

  const HEBREW_YEARS_LIST = [
    { num: 5785, text: 'תשפ"ה' },
    { num: 5786, text: 'תשפ"ו' },
    { num: 5787, text: 'תשפ"ז' },
    { num: 5788, text: 'תשפ"ח' },
    { num: 5789, text: 'תשפ"ט' },
    { num: 5790, text: 'תש"צ' }
  ];

  function toHebrewYear(yearNum) {
    const yObj = HEBREW_YEARS_LIST.find(y => y.num === yearNum);
    return yObj ? yObj.text : yearNum.toString();
  }

  function getTodayHebrewData() {
    try {
      const formatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' });
      const parts = formatter.formatToParts(new Date());
      let day = 1, monthName = 'תשרי', year = 5787;
      for (const p of parts) {
        if (p.type === 'day') day = parseInt(p.value, 10);
        if (p.type === 'month') monthName = p.value;
        if (p.type === 'year') year = parseInt(p.value, 10);
      }
      
      let matchedMonth = HEBREW_MONTHS_LIST.find(m => monthName.includes(m.name)) || HEBREW_MONTHS_LIST[0];
      const dayHeb = HEBREW_DAYS_LIST[day] || day + "'";
      const yearHeb = toHebrewYear(year);
      const dateDisplay = `${dayHeb} ב${matchedMonth.name} ${yearHeb}`;
      const sortKey = Math.floor(year * 10000 + matchedMonth.code * 100 + day);

      return { day, monthCode: matchedMonth.code, monthName: matchedMonth.name, year, dayHeb, yearHeb, dateDisplay, sortKey };
    } catch(e) {
      return { day: 1, monthCode: 1, monthName: 'תשרי', year: 5787, dayHeb: "א'", yearHeb: 'תשפ"ז', dateDisplay: "א' בתשרי תשפ\"ז", sortKey: 57870101 };
    }
  }

  const todayHeb = getTodayHebrewData();

  // טעינה בטוחה של נתונים ושמירה על מידע קיים
  let rawTasks = JSON.parse(localStorage.getItem('app_tasks')) || [];
  let tasks = rawTasks.map(t => {
    // שמירה על הערות/תאריכים ישנים שנוצרו בגרסאות קודמות
    let hebDisplay = t.hebrewDateDisplay || t.hebrewDate || null;
    let sortKey = t.hebrewSortKey || null;
    return {
      ...t,
      hebrewDateDisplay: hebDisplay,
      hebrewSortKey: sortKey
    };
  });

  let subcategories = JSON.parse(localStorage.getItem('app_subcategories')) || [];
  let activeCategory = 'הכל';
  let activeAssignee = 'הכל';

  function saveData() {
    localStorage.setItem('app_tasks', JSON.stringify(tasks));
    localStorage.setItem('app_subcategories', JSON.stringify(subcategories));
  }

  // כותרת תאריך
  const gregDate = new Date().toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('current-date').innerText = `${gregDate} | ${todayHeb.dateDisplay}`;

  function initHebrewDateDropdowns(dayElemId, monthElemId, yearElemId, defaultDay=todayHeb.day, defaultMonth=todayHeb.monthCode, defaultYear=todayHeb.year) {
    const daySelect = document.getElementById(dayElemId);
    const monthSelect = document.getElementById(monthElemId);
    const yearSelect = document.getElementById(yearElemId);

    if (daySelect) {
      daySelect.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = HEBREW_DAYS_LIST[i];
        if (i == defaultDay) opt.selected = true;
        daySelect.appendChild(opt);
      }
    }

    if (monthSelect) {
      monthSelect.innerHTML = '';
      HEBREW_MONTHS_LIST.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.code;
        opt.innerText = m.name;
        if (m.code == defaultMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      });
    }

    if (yearSelect) {
      yearSelect.innerHTML = '';
      HEBREW_YEARS_LIST.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y.num;
        opt.innerText = y.text;
        if (y.num == defaultYear) opt.selected = true;
        yearSelect.appendChild(opt);
      });
    }
  }

  function toggleTaskDateSwitch() {
    const chk = document.getElementById('task-enable-date');
    chk.checked = !chk.checked;
    onDateSwitchChange();
  }

  function onDateSwitchChange() {
    const chk = document.getElementById('task-enable-date');
    const box = document.getElementById('task-date-picker-box');
    if (chk.checked) {
      box.classList.remove('hidden');
      initHebrewDateDropdowns('task-heb-day', 'task-heb-month', 'task-heb-year', todayHeb.day, todayHeb.monthCode, todayHeb.year);
    } else {
      box.classList.add('hidden');
    }
  }

  function onCategoryChange() {
    updateSubcategoryDropdown();
  }

  function updateSubcategoryDropdown() {
    const selectedCat = document.getElementById('task-category').value;
    const subSelect = document.getElementById('task-subcategory');
    subSelect.innerHTML = '<option value="כללי">כללי (ללא תת-קטגוריה)</option>';

    const filteredSubs = subcategories.filter(s => s.parentCategory === selectedCat);
    filteredSubs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.innerText = s.name;
      subSelect.appendChild(opt);
    });
  }

  function promptNewSubcategory() {
    const parentCategory = document.getElementById('task-category').value;
    const name = prompt(`הזן שם לתת-קטגוריה / חנות חדשה עבור "${parentCategory}":`);
    if (!name || !name.trim()) return;

    subcategories.push({
      id: Date.now().toString(),
      name: name.trim(),
      parentCategory: parentCategory
    });
    saveData();
    updateSubcategoryDropdown();
    render();
  }

  function deleteSubcategory(subId, subName, parentCat) {
    if (confirm(`האם למחוק את תת-הקטגוריה "${subName}"? כל המשימות בתוכה יימחקו!`)) {
      subcategories = subcategories.filter(s => s.id !== subId);
      tasks = tasks.filter(t => !(t.category === parentCat && t.subcategory === subName));
      saveData();
      updateSubcategoryDropdown();
      render();
    }
  }

  function addTask() {
    const title = document.getElementById('task-title').value.trim();
    const category = document.getElementById('task-category').value;
    const assignee = document.getElementById('task-assignee').value;
    const subcategory = document.getElementById('task-subcategory').value;
    const hasDate = document.getElementById('task-enable-date').checked;

    if (!title) return alert('נא להזין תיאור משימה');

    let hebDateDisplay = null;
    let hebSortKey = null;
    let dayVal = null, monthVal = null, yearVal = null;

    if (hasDate) {
      dayVal = parseInt(document.getElementById('task-heb-day').value) || todayHeb.day;
      monthVal = parseFloat(document.getElementById('task-heb-month').value) || todayHeb.monthCode;
      yearVal = parseInt(document.getElementById('task-heb-year').value) || todayHeb.year;

      const monthObj = HEBREW_MONTHS_LIST.find(m => m.code === monthVal) || HEBREW_MONTHS_LIST[0];
      hebDateDisplay = `${HEBREW_DAYS_LIST[dayVal]} ב${monthObj.name} ${toHebrewYear(yearVal)}`;
      hebSortKey = Math.floor(yearVal * 10000 + monthVal * 100 + dayVal);
    }

    tasks.push({
      id: Date.now().toString(),
      title,
      category,
      assignee,
      subcategory,
      hebrewDateDisplay: hebDateDisplay,
      hebrewSortKey: hebSortKey,
      hebDay: dayVal,
      hebMonth: monthVal,
      hebYear: yearVal,
      completed: false
    });

    saveData();
    document.getElementById('task-title').value = '';
    document.getElementById('task-enable-date').checked = false;
    document.getElementById('task-date-picker-box').classList.add('hidden');
    render();
  }

  function setCategoryFilter(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll('.cat-filter-btn').forEach(b => {
      b.classList.remove('bg-indigo-600', 'text-white');
      b.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
    });
    btn.classList.remove('bg-white', 'text-gray-600', 'border');
    btn.classList.add('bg-indigo-600', 'text-white');
    render();
  }

  function setAssigneeFilter(ass, btn) {
    activeAssignee = ass;
    document.querySelectorAll('.ass-filter-btn').forEach(b => {
      b.classList.remove('bg-gray-700', 'text-white');
      b.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
    });
    btn.classList.remove('bg-white', 'text-gray-600', 'border');
    btn.classList.add('bg-gray-700', 'text-white');
    render();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveData();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveData();
    render();
  }

  function toggleEdit(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, isEditing: !t.isEditing } : t);
    render();
    const task = tasks.find(t => t.id === id);
    if (task && task.isEditing) {
      const hasDate = !!task.hebrewSortKey;
      const chk = document.getElementById(`edit-enable-date-${id}`);
      if (chk) chk.checked = hasDate;
      if (hasDate) {
        document.getElementById(`edit-date-box-${id}`).classList.remove('hidden');
        initHebrewDateDropdowns(`edit-heb-day-${id}`, `edit-heb-month-${id}`, `edit-heb-year-${id}`, task.hebDay || todayHeb.day, task.hebMonth || todayHeb.monthCode, task.hebYear || todayHeb.year);
      }
    }
  }

  function onEditDateSwitchChange(id) {
    const chk = document.getElementById(`edit-enable-date-${id}`);
    const box = document.getElementById(`edit-date-box-${id}`);
    if (chk.checked) {
      box.classList.remove('hidden');
      initHebrewDateDropdowns(`edit-heb-day-${id}`, `edit-heb-month-${id}`, `edit-heb-year-${id}`, todayHeb.day, todayHeb.monthCode, todayHeb.year);
    } else {
      box.classList.add('hidden');
    }
  }

  function saveEdit(id) {
    const newTitle = document.getElementById(`edit-title-${id}`).value.trim();
    const newAssignee = document.getElementById(`edit-assignee-${id}`).value;
    const hasDate = document.getElementById(`edit-enable-date-${id}`).checked;

    if (!newTitle) return;

    let hebDateDisplay = null;
    let hebSortKey = null;
    let dayVal = null, monthVal = null, yearVal = null;

    if (hasDate) {
      dayVal = parseInt(document.getElementById(`edit-heb-day-${id}`).value) || todayHeb.day;
      monthVal = parseFloat(document.getElementById(`edit-heb-month-${id}`).value) || todayHeb.monthCode;
      yearVal = parseInt(document.getElementById(`edit-heb-year-${id}`).value) || todayHeb.year;

      const monthObj = HEBREW_MONTHS_LIST.find(m => m.code === monthVal) || HEBREW_MONTHS_LIST[0];
      hebDateDisplay = `${HEBREW_DAYS_LIST[dayVal]} ב${monthObj.name} ${toHebrewYear(yearVal)}`;
      hebSortKey = Math.floor(yearVal * 10000 + monthVal * 100 + dayVal);
    }

    tasks = tasks.map(t => t.id === id ? {
      ...t,
      title: newTitle,
      assignee: newAssignee,
      hebrewDateDisplay: hebDateDisplay,
      hebrewSortKey: hebSortKey,
      hebDay: dayVal,
      hebMonth: monthVal,
      hebYear: yearVal,
      isEditing: false
    } : t);

    saveData();
    render();
  }

  function sortTasks(taskList) {
    return taskList.sort((a, b) => {
      if (a.hebrewSortKey && b.hebrewSortKey) {
        return a.hebrewSortKey - b.hebrewSortKey;
      }
      if (a.hebrewSortKey && !b.hebrewSortKey) return -1;
      if (!a.hebrewSortKey && b.hebrewSortKey) return 1;
      return 0;
    });
  }

  function updateTodayBanner() {
    const todayBanner = document.getElementById('today-banner');
    const todayList = document.getElementById('today-tasks-list');
    const todayCount = document.getElementById('today-count');
    const todayDateText = document.getElementById('today-date-text');

    const todayTasks = tasks.filter(t => t.hebrewSortKey === todayHeb.sortKey && !t.completed);

    if (todayTasks.length === 0) {
      todayBanner.classList.add('hidden');
      return;
    }

    todayBanner.classList.remove('hidden');
    todayDateText.innerText = todayHeb.dateDisplay;
    todayCount.innerText = todayTasks.length;
    todayList.innerHTML = '';

    todayTasks.forEach(t => {
      const item = document.createElement('div');
      item.className = 'flex items-center justify-between text-xs font-semibold text-amber-900 bg-white/80 p-2 rounded-lg border border-amber-200/60';
      item.innerHTML = `
        <div class="flex items-center gap-2">
          <input type="checkbox" onclick="toggleTask('${t.id}')" class="w-3.5 h-3.5 text-amber-600 rounded">
          <span>${t.title}</span>
        </div>
        <span class="text-[10px] bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-bold">${t.assignee}</span>
      `;
      todayList.appendChild(item);
    });
  }

  function render() {
    updateTodayBanner();

    const container = document.getElementById('tasks-container');
    container.innerHTML = '';

    let filtered = tasks.filter(t => {
      let matchCat = false;
      if (activeCategory === 'הכל') {
        matchCat = true;
      } else if (activeCategory === '📅 עם תאריך') {
        matchCat = !!t.hebrewSortKey || !!t.hebrewDateDisplay;
      } else {
        matchCat = t.category === activeCategory;
      }

      const matchAss = activeAssignee === 'הכל' || t.assignee === activeAssignee;
      return matchCat && matchAss;
    });

    filtered = sortTasks(filtered);

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">אין משימות להצגה</div>';
      return;
    }

    const generalTasks = filtered.filter(t => !t.subcategory || t.subcategory === 'כללי');
    if (generalTasks.length > 0) {
      if (activeCategory !== 'הכל' && activeCategory !== '📅 עם תאריך') {
        const genHeader = document.createElement('div');
        genHeader.className = 'text-xs font-bold text-gray-500 mb-1 px-1';
        genHeader.innerText = '📌 משימות כלליות';
        container.appendChild(genHeader);
      }
      generalTasks.forEach(task => container.appendChild(createTaskCard(task)));
    }

    const subGrouped = {};
    filtered.filter(t => t.subcategory && t.subcategory !== 'כללי').forEach(t => {
      const key = `${t.category}___${t.subcategory}`;
      if (!subGrouped[key]) subGrouped[key] = [];
      subGrouped[key].push(t);
    });

    for (const [groupKey, items] of Object.entries(subGrouped)) {
      const [catName, subName] = groupKey.split('___');
      const subObj = subcategories.find(s => s.name === subName && s.parentCategory === catName);

      const groupCard = document.createElement('div');
      groupCard.className = 'bg-gray-50 p-3 rounded-2xl border border-gray-200 space-y-2 mt-2';

      const header = document.createElement('div');
      header.className = 'flex justify-between items-center mb-1';
      header.innerHTML = `
        <span class="text-xs font-bold text-gray-700">📂 ${subName} ${activeCategory === 'הכל' ? `(${catName})` : ''}</span>
        ${subObj ? `<button onclick="deleteSubcategory('${subObj.id}', '${subName}', '${catName}')" class="text-gray-400 hover:text-red-600 text-xs font-normal">🗑️ מחק תת-קטגוריה</button>` : ''}
      `;
      groupCard.appendChild(header);

      items.forEach(task => groupCard.appendChild(createTaskCard(task)));
      container.appendChild(groupCard);
    }
  }

  function createTaskCard(task) {
    const card = document.createElement('div');
    const isToday = task.hebrewSortKey === todayHeb.sortKey;
    
    card.className = `bg-white p-3 rounded-xl shadow-sm border ${isToday ? 'border-amber-400 bg-amber-50/30' : 'border-gray-100'} flex items-center justify-between mb-1.5 ${task.completed ? 'opacity-50' : ''}`;

    if (task.isEditing) {
      card.innerHTML = `
        <div class="w-full space-y-2">
          <input type="text" id="edit-title-${task.id}" value="${task.title}" class="w-full p-1.5 border rounded-lg text-sm">
          <div class="grid grid-cols-2 gap-2">
            <select id="edit-assignee-${task.id}" class="p-1 border rounded-lg text-xs">
              <option value="שנינו" ${task.assignee === 'שנינו' ? 'selected' : ''}>שנינו</option>
              <option value="יוסי" ${task.assignee === 'יוסי' ? 'selected' : ''}>יוסי</option>
              <option value="אסתי" ${task.assignee === 'אסתי' ? 'selected' : ''}>אסתי</option>
            </select>
            <div class="flex items-center gap-1">
              <input type="checkbox" id="edit-enable-date-${task.id}" onchange="onEditDateSwitchChange('${task.id}')">
              <label for="edit-enable-date-${task.id}" class="text-xs text-gray-600">משוייך לתאריך</label>
            </div>
          </div>
          <div id="edit-date-box-${task.id}" class="hidden grid grid-cols-3 gap-1">
            <select id="edit-heb-day-${task.id}" class="p-1 border rounded-lg text-xs"></select>
            <select id="edit-heb-month-${task.id}" class="p-1 border rounded-lg text-xs"></select>
            <select id="edit-heb-year-${task.id}" class="p-1 border rounded-lg text-xs"></select>
          </div>
          <button onclick="saveEdit('${task.id}')" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold">שמור</button>
        </div>
      `;
    } else {
      let badgeColor = 'bg-purple-100 text-purple-700';
      if (task.assignee === 'יוסי') badgeColor = 'bg-blue-100 text-blue-700';
      if (task.assignee === 'אסתי') badgeColor = 'bg-pink-100 text-pink-700';

      const dateText = task.hebrewDateDisplay || task.hebrewDate || null;

      card.innerHTML = `
        <div class="flex items-center gap-2.5 flex-1">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${task.id}')" class="w-4 h-4 text-indigo-600 rounded">
          <div>
            <span class="text-sm ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'} font-medium block">${task.title}</span>
            <div class="flex gap-1 mt-0.5 flex-wrap">
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${badgeColor}">${task.assignee}</span>
              ${activeCategory === 'הכל' || activeCategory === '📅 עם תאריך' ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-bold">🏷️ ${task.category}</span>` : ''}
              ${dateText ? `<span class="text-[10px] px-2 py-0.5 rounded-full ${isToday ? 'bg-amber-100 text-amber-800 font-extrabold border border-amber-300' : 'bg-blue-50 text-blue-700 border border-blue-200'} font-bold">📅 ${dateText}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="flex gap-1">
          <button onclick="toggleEdit('${task.id}')" class="text-gray-400 hover:text-indigo-600 p-1 text-xs">✏️</button>
          <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-600 p-1 text-xs">🗑️</button>
        </div>
      `;
    }

    return card;
  }

  updateSubcategoryDropdown();
  render();
</script>
</body>
</html>

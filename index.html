<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המשימות שלנו</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="המשימות שלנו">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- ספריות Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="max-w-md mx-auto p-4 min-h-screen pb-20">

  <!-- כפתור התקנה PWA -->
  <button id="install-btn" onclick="installPWA()" class="w-full mb-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl hidden">
    התקן את האפליקציה במסך הבית 📲
  </button>

  <!-- כותרת -->
  <header class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center mb-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">המשימות שלנו 📋</h1>
    <div id="current-date" class="text-xs font-bold text-indigo-600"></div>
  </header>

  <!-- טופס הוספת משימה -->
  <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">
    <h2 class="text-base font-bold text-gray-700 mb-3">➕ הוספת משימה חדשה</h2>
    
    <div class="space-y-3">
      <input type="text" id="task-title" placeholder="מה צריך לעשות / לקנות?" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-indigo-500">
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">קטגוריה</label>
          <select id="task-category" onchange="toggleStoreInput()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm">
            <option value="קניות">🛒 קניות</option>
            <option value="מטלות בית">🏠 מטלות בית</option>
            <option value="תזכורות">⏰ תזכורות</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">אחראי/ת</label>
          <select id="task-assignee" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm">
            <option value="יוסי">יוסי</option>
            <option value="אסתי">אסתי</option>
          </select>
        </div>
      </div>

      <!-- שדה חנות (מופיע רק בקניות) -->
      <div id="store-input-container">
        <input type="text" id="task-store" placeholder="שם החנות (למשל: סופר, ירקן, פארם)" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-indigo-500">
      </div>

      <button onclick="addTask()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">
        הוסף משימה
      </button>
    </div>
  </section>

  <!-- סרגל סינון קטגוריות -->
  <div class="flex gap-1.5 mb-4 overflow-x-auto pb-1">
    <button onclick="setCategoryFilter('הכל', this)" class="filter-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm whitespace-nowrap">הכל</button>
    <button onclick="setCategoryFilter('קניות', this)" class="filter-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">🛒 קניות</button>
    <button onclick="setCategoryFilter('מטלות בית', this)" class="filter-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">🏠 מטלות בית</button>
    <button onclick="setCategoryFilter('תזכורות', this)" class="filter-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">⏰ תזכורות</button>
  </div>

  <!-- רשימת המשימות -->
  <main id="tasks-container" class="space-y-3"></main>

<script>
  // הגדרות Firebase - הזינו את הפרטים המדויקים מתוך הגדרות הפרויקט ב-Firebase
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let tasks = [];
  let activeCategory = 'הכל';

  document.getElementById('current-date').innerText = new Date().toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  // הגדרת מאזין בזמן אמת לשינויים במסד הנתונים בענן
  db.collection('tasks').onSnapshot((snapshot) => {
    tasks = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));
    render();
  });

  function toggleStoreInput() {
    const cat = document.getElementById('task-category').value;
    document.getElementById('store-input-container').style.display = cat === 'קניות' ? 'block' : 'none';
  }

  function addTask() {
    const title = document.getElementById('task-title').value.trim();
    const category = document.getElementById('task-category').value;
    const assignee = document.getElementById('task-assignee').value;
    const store = document.getElementById('task-store').value.trim() || 'כללי';

    if (!title) return alert('נא להזין תיאור משימה');

    db.collection('tasks').add({
      title,
      category,
      assignee,
      store: category === 'קניות' ? store : null,
      completed: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('task-title').value = '';
    document.getElementById('task-store').value = '';
  }

  function setCategoryFilter(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('bg-indigo-600', 'text-white');
      b.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
    });
    btn.classList.remove('bg-white', 'text-gray-600', 'border');
    btn.classList.add('bg-indigo-600', 'text-white');
    render();
  }

  function toggleTask(id, currentStatus) {
    db.collection('tasks').doc(id).update({
      completed: !currentStatus
    });
  }

  function deleteTask(id) {
    db.collection('tasks').doc(id).delete();
  }

  function toggleEdit(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, isEditing: !t.isEditing } : t);
    render();
  }

  function saveEdit(id) {
    const newTitle = document.getElementById(`edit-title-${id}`).value.trim();
    const newAssignee = document.getElementById(`edit-assignee-${id}`).value;
    const newStoreInput = document.getElementById(`edit-store-${id}`);
    const newStore = newStoreInput ? newStoreInput.value.trim() || 'כללי' : null;

    if (!newTitle) return;

    db.collection('tasks').doc(id).update({
      title: newTitle,
      assignee: newAssignee,
      store: newStore
    });
  }

  function render() {
    const container = document.getElementById('tasks-container');
    container.innerHTML = '';

    const filtered = activeCategory === 'הכל' 
      ? tasks 
      : tasks.filter(t => t.category === activeCategory);

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">אין משימות להצגה</div>';
      return;
    }

    if (activeCategory === 'קניות') {
      const grouped = filtered.reduce((acc, task) => {
        const s = task.store || 'כללי';
        if (!acc[s]) acc[s] = [];
        acc[s].push(task);
        return acc;
      }, {});

      for (const [storeName, items] of Object.entries(grouped)) {
        const groupHeader = document.createElement('div');
        groupHeader.className = 'text-xs font-bold text-gray-500 mt-3 mb-1 px-1';
        groupHeader.innerText = `🏬 חנות: ${storeName}`;
        container.appendChild(groupHeader);

        items.forEach(task => container.appendChild(createTaskCard(task)));
      }
    } else {
      filtered.forEach(task => container.appendChild(createTaskCard(task)));
    }
  }

  function createTaskCard(task) {
    const card = document.createElement('div');
    card.className = `bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between ${task.completed ? 'opacity-50' : ''}`;

    if (task.isEditing) {
      card.innerHTML = `
        <div class="w-full space-y-2">
          <input type="text" id="edit-title-${task.id}" value="${task.title}" class="w-full p-1.5 border rounded-lg text-sm">
          <div class="flex gap-2">
            <select id="edit-assignee-${task.id}" class="p-1 border rounded-lg text-xs">
              <option value="יוסי" ${task.assignee === 'יוסי' ? 'selected' : ''}>יוסי</option>
              <option value="אסתי" ${task.assignee === 'אסתי' ? 'selected' : ''}>אסתי</option>
            </select>
            ${task.category === 'קניות' ? `<input type="text" id="edit-store-${task.id}" value="${task.store || ''}" placeholder="חנות" class="p-1 border rounded-lg text-xs flex-1">` : ''}
          </div>
          <button onclick="saveEdit('${task.id}')" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold">שמור</button>
        </div>
      `;
    } else {
      const badgeColor = task.assignee === 'יוסי' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700';
      card.innerHTML = `
        <div class="flex items-center gap-2.5 flex-1">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${task.id}', ${task.completed})" class="w-4 h-4 text-indigo-600 rounded">
          <div>
            <span class="text-sm ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'} font-medium block">${task.title}</span>
            <div class="flex gap-1 mt-0.5">
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${badgeColor}">${task.assignee}</span>
              ${task.store ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">🏬 ${task.store}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="flex gap-1">
          <button onclick="toggleEdit('${task.id}')" class="text-gray-400 hover:text-indigo-600 p-1 text-xs">✏️</button>
          <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-600 p-1 text-xs">🗑️</button>
        </div>
      `;
    }

    return card;
  }

  function installPWA() {}
</script>
</body>
</html>

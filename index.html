<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המשימות שלנו v1.0.3</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="המשימות שלנו">

  <!-- לוגו ואייקון מותאם אישית למסך הבית (SVG ברזולוציה גבוהה) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' style='background:%234f46e5; border-radius: 20%;'><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='300'>📋</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' style='background:%234f46e5; border-radius: 20%;'><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='300'>📋</text></svg>">

  <!-- הגדרות אפליקציה להתקנה (PWA Manifest) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"המשימות שלנו","short_name":"משימות","start_url":".?v=3","display":"standalone","background_color":"%23ffffff","theme_color":"%234f46e5","icons":[{"src":"data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 512 512%27 style=%27background:%234f46e5;%27><text x=%2750%%27 y=%2755%%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 font-size=%27300%27>📋</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="max-w-md mx-auto p-4 min-h-screen pb-20">

  <!-- כותרת ותאריך -->
  <header class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center mb-4 relative">
    <span class="absolute top-2 left-3 text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">v1.0.3</span>
    <h1 class="text-2xl font-bold text-gray-800 mb-1">המשימות שלנו 📋</h1>
    <div id="current-date" class="text-xs font-bold text-indigo-600 mb-2"></div>
    
    <!-- מחוון חשבון / קוד משפחתי -->
    <div class="inline-flex items-center gap-2 bg-indigo-50 border border-indigo-100 text-indigo-800 text-xs px-3 py-1 rounded-full font-bold mb-2">
      <span>🔑 חשבון: <strong id="display-group-name">...</strong></span>
      <button onclick="switchUserGroup()" class="text-[10px] text-indigo-600 underline hover:text-indigo-900">החלף</button>
    </div>

    <!-- כפתור להתקנת האפליקציה בלחיצה אחת -->
    <button id="install-pwa-btn" onclick="installPWA()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-md transition flex items-center justify-center gap-1.5 mx-auto w-full cursor-pointer">
      📲 התקן את האפליקציה למכשיר
    </button>
  </header>

  <!-- באנר משימות להיום -->
  <div id="today-banner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-3.5 mb-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-bold text-amber-900 flex items-center gap-1">
        ⭐ משימות להיום (<span id="today-date-text"></span>)
      </span>
      <span id="today-count" class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-bold">0</span>
    </div>
    <div id="today-tasks-list" class="space-y-1.5"></div>
  </div>

  <!-- טופס הוספת משימה -->
  <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">
    <h2 class="text-base font-bold text-gray-700 mb-3">➕ הוספת משימה חדשה</h2>
    
    <div class="space-y-3">
      <input type="text" id="task-title" placeholder="מה צריך לעשות / לקנות?" class="w-full p-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-indigo-500">
      
      <div class="grid grid-cols-2 gap-2">
        <!-- קטגוריה ראשית -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-500">קטגוריה ראשית</label>
            <div class="flex gap-1 text-[10px]">
              <button type="button" onclick="openAddModal('category')" class="text-indigo-600 font-bold hover:underline">+ הוסף</button>
              <button type="button" onclick="openEditModal('category')" class="text-amber-600 font-bold hover:underline">✏️</button>
              <button type="button" onclick="openDeleteModal('category')" class="text-red-500 font-bold hover:underline">🗑️</button>
            </div>
          </div>
          <select id="task-category" onchange="onCategorySelectChange()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm"></select>
        </div>

        <!-- אחראי/ת -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-500">אחראי/ת</label>
            <div class="flex gap-1 text-[10px]">
              <button type="button" onclick="openAddModal('assignee')" class="text-indigo-600 font-bold hover:underline">+ הוסף</button>
              <button type="button" onclick="openEditModal('assignee')" class="text-amber-600 font-bold hover:underline">✏️</button>
              <button type="button" onclick="openDeleteModal('assignee')" class="text-red-500 font-bold hover:underline">🗑️</button>
            </div>
          </div>
          <select id="task-assignee" onchange="onAssigneeSelectChange()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm"></select>
        </div>
      </div>

      <!-- מתג הפעלת תאריך עברי -->
      <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 space-y-2">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-bold text-gray-700 flex items-center gap-1.5">
            📅 הגדר תאריך עברי למשימה
          </span>
          <input type="checkbox" id="task-enable-date" onchange="onDateSwitchChange()" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
        </label>

        <!-- בחירת תאריך עברי -->
        <div id="task-date-picker-box" class="hidden grid grid-cols-3 gap-1.5 pt-1 border-t border-gray-200/60">
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">יום</label>
            <select id="task-heb-day" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">חודש</label>
            <select id="task-heb-month" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">שנה</label>
            <select id="task-heb-year" class="w-full p-1.5 border border-gray-200 rounded-lg bg-white text-xs"></select>
          </div>
        </div>
      </div>

      <!-- קטגוריה / חנות -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs text-gray-500">קטגוריה / חנות (רשות)</label>
          <div class="flex gap-1 text-[10px]">
            <button type="button" onclick="openAddModal('subcategory')" class="text-indigo-600 font-bold hover:underline">+ הוסף</button>
            <button type="button" onclick="openEditModal('subcategory')" class="text-amber-600 font-bold hover:underline">✏️</button>
            <button type="button" onclick="openDeleteModal('subcategory')" class="text-red-500 font-bold hover:underline">🗑️</button>
          </div>
        </div>
        <select id="task-subcategory" onchange="onSubcategorySelectChange()" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm"></select>
      </div>

      <button onclick="addTask()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition cursor-pointer">
        הוסף משימה
      </button>
    </div>
  </section>

  <!-- סרגלי סינון -->
  <div class="space-y-2 mb-4">
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="category-filter-bar"></div>
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="assignee-filter-bar"></div>
    <div id="subcategory-filter-bar" class="hidden flex items-center gap-1.5 overflow-x-auto pb-1">
      <span class="text-xs text-gray-400 pl-1 font-medium whitespace-nowrap">קטגוריה:</span>
      <div id="subcategory-filter-buttons" class="flex gap-1.5 overflow-x-auto"></div>
    </div>
  </div>

  <!-- רשימת המשימות -->
  <main id="tasks-container" class="space-y-3"></main>

  <!-- מודאל הוספה -->
  <div id="add-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl space-y-3">
      <h3 id="add-modal-title" class="text-sm font-bold text-gray-800"></h3>
      <div>
        <label class="block text-xs text-gray-500 mb-1">בחר אימוג'י להצעה:</label>
        <div id="emoji-picker" class="flex flex-wrap gap-1.5 p-2 bg-gray-50 rounded-xl border border-gray-100 max-h-28 overflow-y-auto"></div>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">שם:</label>
        <input type="text" id="add-modal-input" class="w-full p-2 border border-gray-200 rounded-xl text-sm outline-none focus:border-indigo-500">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddModal()" class="px-3 py-1.5 text-xs font-bold text-gray-500 bg-gray-100 rounded-xl cursor-pointer">ביטול</button>
        <button onclick="confirmAddModal()" class="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 rounded-xl cursor-pointer">אישור</button>
      </div>
    </div>
  </div>

  <!-- מודאל עריכת קטגוריות / אחראים -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="edit-modal-title" class="text-sm font-bold text-gray-800">עריכת פריטים:</h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
      </div>
      
      <div id="edit-modal-list" class="space-y-2 max-h-60 overflow-y-auto pt-1"></div>

      <div class="flex justify-end pt-2 border-t border-gray-100">
        <button onclick="closeEditModal()" class="px-3 py-1.5 text-xs font-bold text-gray-500 bg-gray-100 rounded-xl cursor-pointer">סגור</button>
      </div>
    </div>
  </div>

  <!-- מודאל מחיקה -->
  <div id="delete-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="delete-modal-title" class="text-sm font-bold text-gray-800">לחץ על מה שברצונך למחוק:</h3>
        <button onclick="closeDeleteModal()" class="text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
      </div>
      
      <div id="delete-modal-list" class="space-y-1.5 max-h-60 overflow-y-auto pt-1"></div>

      <div class="flex justify-end pt-2 border-t border-gray-100">
        <button onclick="closeDeleteModal()" class="px-3 py-1.5 text-xs font-bold text-gray-500 bg-gray-100 rounded-xl cursor-pointer">סגור</button>
      </div>
    </div>
  </div>

<script>
  // ניהול התקנת PWA
  let deferredPrompt;
  const installBtn = document.getElementById('install-pwa-btn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.classList.remove('hidden');
  });

  async function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      if (installBtn) installBtn.classList.add('hidden');
    }
    deferredPrompt = null;
  }

  window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.classList.add('hidden');
    deferredPrompt = null;
  });

  // הגדרות Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDLs89sfyIr-6aBT4A_OcXOVhLLeauWOR0",
    authDomain: "my-tasks-app-3e4da.firebaseapp.com",
    projectId: "my-tasks-app-3e4da",
    storageBucket: "my-tasks-app-3e4da.firebasestorage.app",
    messagingSenderId: "1002745919988",
    appId: "1:1002745919988:web:6ecf90c2bacab4ee5e61a1"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ניהול קוד משפחתי / שם משתמש
  let userGroup = localStorage.getItem('app_userGroup');

  function checkUserGroup() {
    if (!userGroup) {
      userGroup = prompt("הכנס שם משתמש / קוד משפחתי (למשל: ctorza):");
      if (userGroup) {
        userGroup = userGroup.trim().toLowerCase();
        localStorage.setItem('app_userGroup', userGroup);
      } else {
        userGroup = "default";
      }
    }
    document.getElementById('display-group-name').innerText = userGroup;
  }

  function switchUserGroup() {
    const newGroup = prompt("הכנס קוד משפחתי חדש להתחברות:", userGroup);
    if (newGroup && newGroup.trim() !== "") {
      userGroup = newGroup.trim().toLowerCase();
      localStorage.setItem('app_userGroup', userGroup);
      document.getElementById('display-group-name').innerText = userGroup;
      listenToCloudData();
    }
  }

  checkUserGroup();

  const HEBREW_DAYS_LIST = [
    "", "א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ז'", "ח'", "ט'", "י'",
    'י"א', 'י"ב', 'י"ג', 'י"ד', 'ט"ו', 'ט"ז', 'י"ז', 'י"ח', 'י"ט', "כ'",
    'כ"א', 'כ"ב', 'כ"ג', 'כ"ד', 'כ"ה', 'כ"ו', 'כ"ז', 'כ"ח', 'כ"ט', "ל'"
  ];

  const HEBREW_MONTHS_LIST = [
    { name: 'תשרי', code: 1 }, { name: 'חשוון', code: 2 }, { name: 'כסלו', code: 3 },
    { name: 'טבת', code: 4 }, { name: 'שבט', code: 5 }, { name: 'אדר', code: 6 },
    { name: 'אדר א\'', code: 6.1 }, { name: 'אדר ב\'', code: 6.2 }, { name: 'ניסן', code: 7 },
    { name: 'אייר', code: 8 }, { name: 'סיוון', code: 9 }, { name: 'תמוז', code: 10 },
    { name: 'אב', code: 11 }, { name: 'אלול', code: 12 }
  ];

  const HEBREW_YEARS_LIST = [
    { num: 5785, text: 'תשפ"ה' }, { num: 5786, text: 'תשפ"ו' }, { num: 5787, text: 'תשפ"ז' },
    { num: 5788, text: 'תשפ"ח' }, { num: 5789, text: 'תשפ"ט' }, { num: 5790, text: 'תש"צ' }
  ];

  function toHebrewYear(yearNum) {
    const yObj = HEBREW_YEARS_LIST.find(y => y.num === yearNum);
    return yObj ? yObj.text : yearNum.toString();
  }

  function getTodayHebrewData() {
    try {
      const formatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' });
      const parts = formatter.formatToParts(new Date());
      let day = 1, monthName = 'תשרי', year = 5787;
      for (const p of parts) {
        if (p.type === 'day') day = parseInt(p.value, 10);
        if (p.type === 'month') monthName = p.value;
        if (p.type === 'year') year = parseInt(p.value, 10);
      }
      let matchedMonth = HEBREW_MONTHS_LIST.find(m => monthName.includes(m.name)) || HEBREW_MONTHS_LIST[0];
      const dayHeb = HEBREW_DAYS_LIST[day] || day + "'";
      const yearHeb = toHebrewYear(year);
      return { day, monthCode: matchedMonth.code, monthName: matchedMonth.name, year, dayHeb, yearHeb, dateDisplay: `${dayHeb} ב${matchedMonth.name} ${yearHeb}`, sortKey: Math.floor(year * 10000 + matchedMonth.code * 100 + day) };
    } catch(e) {
      return { day: 1, monthCode: 1, monthName: 'תשרי', year: 5787, dayHeb: "א'", yearHeb: 'תשפ"ז', dateDisplay: "א' בתשרי תשפ\"ז", sortKey: 57870101 };
    }
  }

  const todayHeb = getTodayHebrewData();

  let categories = ['🛒 קניות', '🏠 מטלות בית', '⏰ תזכורות'];
  let assignees = ['👫 שנינו', '👨 יוסי', '👩 אסתי'];
  let subcategories = [];
  let tasks = [];

  let activeCategory = 'הכל';
  let activeAssignee = 'הכל';
  let activeSubcategory = 'הכל';

  let currentAddType = null;
  let currentEditType = null;
  let currentDeleteType = null;

  let unsubscribeListener = null;

  const CATEGORY_EMOJIS = ['🛒', '🏠', '⏰', '🧹', '📦', '🚗', '💼', '🍕', '💊', '🛠️', '📌', '⭐', '📝', '🍞', '🥩', '🧼'];
  const ASSIGNEE_EMOJIS = ['👨', '👩', '👫', '👤', '🧑', '👧', '👦', '👵', '👴', '⭐'];

  // סנכרון מול Cloud Firestore
  function listenToCloudData() {
    if (unsubscribeListener) unsubscribeListener();

    unsubscribeListener = db.collection('user_groups').doc(userGroup).onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        categories = data.categories || ['🛒 קניות', '🏠 מטלות בית', '⏰ תזכורות'];
        assignees = data.assignees || ['👫 שנינו', '👨 יוסי', '👩 אסתי'];
        subcategories = data.subcategories || [];
        tasks = data.tasks || [];
      } else {
        saveDataCloud();
      }

      updateCategoryDropdown();
      updateAssigneeDropdown();
      updateSubcategoryDropdown();
      renderCategoryFilterBar();
      renderAssigneeFilterBar();
      updateSubcategoryFilterBar();
      render();
    });
  }

  function saveDataCloud() {
    db.collection('user_groups').doc(userGroup).set({
      categories: categories,
      assignees: assignees,
      subcategories: subcategories,
      tasks: tasks
    }, { merge: true });
  }

  const gregDate = new Date().toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('current-date').innerText = `${gregDate} | ${todayHeb.dateDisplay}`;

  function initHebrewDateDropdowns(dayElemId, monthElemId, yearElemId, defaultDay=todayHeb.day, defaultMonth=todayHeb.monthCode, defaultYear=todayHeb.year) {
    const daySelect = document.getElementById(dayElemId);
    const monthSelect = document.getElementById(monthElemId);
    const yearSelect = document.getElementById(yearElemId);

    if (daySelect) {
      daySelect.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = HEBREW_DAYS_LIST[i];
        if (i == defaultDay) opt.selected = true;
        daySelect.appendChild(opt);
      }
    }

    if (monthSelect) {
      monthSelect.innerHTML = '';
      HEBREW_MONTHS_LIST.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.code;
        opt.innerText = m.name;
        if (m.code == defaultMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      });
    }

    if (yearSelect) {
      yearSelect.innerHTML = '';
      HEBREW_YEARS_LIST.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y.num;
        opt.innerText = y.text;
        if (y.num == defaultYear) opt.selected = true;
        yearSelect.appendChild(opt);
      });
    }
  }

  function onDateSwitchChange() {
    const chk = document.getElementById('task-enable-date');
    const box = document.getElementById('task-date-picker-box');
    if (chk.checked) {
      box.classList.remove('hidden');
      initHebrewDateDropdowns('task-heb-day', 'task-heb-month', 'task-heb-year', todayHeb.day, todayHeb.monthCode, todayHeb.year);
    } else {
      box.classList.add('hidden');
    }
  }

  /* --- מודאל הוספה --- */
  function openAddModal(type) {
    currentAddType = type;
    const modal = document.getElementById('add-modal');
    const title = document.getElementById('add-modal-title');
    const picker = document.getElementById('emoji-picker');
    const input = document.getElementById('add-modal-input');

    input.value = '';
    picker.innerHTML = '';

    let emojis = CATEGORY_EMOJIS;
    if (type === 'category') {
      title.innerText = '➕ הוספת קטגוריה ראשית';
    } else if (type === 'assignee') {
      title.innerText = '➕ הוספת אחראי/ת';
      emojis = ASSIGNEE_EMOJIS;
    } else if (type === 'subcategory') {
      const parentCategory = document.getElementById('task-category').value;
      title.innerText = `➕ הוספת קטגוריה עבור "${parentCategory}"`;
    }

    emojis.forEach(emoji => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'text-lg p-1.5 hover:bg-gray-200 rounded-lg transition cursor-pointer';
      btn.innerText = emoji;
      btn.onclick = () => {
        if (!input.value.startsWith(emoji)) {
          input.value = emoji + ' ' + input.value.replace(/^[^\s]+\s/, '');
        }
      };
      picker.appendChild(btn);
    });

    modal.classList.remove('hidden');
    input.focus();
  }

  function closeAddModal() {
    document.getElementById('add-modal').classList.add('hidden');
    updateCategoryDropdown();
    updateAssigneeDropdown();
    updateSubcategoryDropdown();
  }

  function confirmAddModal() {
    const val = document.getElementById('add-modal-input').value.trim();
    if (!val) return alert('נא להזין שם');

    if (currentAddType === 'category') {
      if (!categories.includes(val)) {
        categories.push(val);
        saveDataCloud();
      }
    } else if (currentAddType === 'assignee') {
      if (!assignees.includes(val)) {
        assignees.push(val);
        saveDataCloud();
      }
    } else if (currentAddType === 'subcategory') {
      const parentCategory = document.getElementById('task-category').value;
      subcategories.push({ id: Date.now().toString(), name: val, parentCategory: parentCategory });
      saveDataCloud();
    }

    document.getElementById('add-modal').classList.add('hidden');
  }

  /* --- מודאל עריכה --- */
  function openEditModal(type) {
    currentEditType = type;
    const modal = document.getElementById('edit-modal');
    const list = document.getElementById('edit-modal-list');
    const title = document.getElementById('edit-modal-title');
    list.innerHTML = '';

    let itemsSet = new Set();

    if (type === 'category') {
      title.innerText = '✏️ עריכת קטגוריות ראשיות:';
      categories.forEach(c => itemsSet.add(c));
    } else if (type === 'assignee') {
      title.innerText = '✏️ עריכת אחראים:';
      assignees.forEach(a => itemsSet.add(a));
    } else if (type === 'subcategory') {
      const parentCategory = document.getElementById('task-category').value;
      title.innerText = `✏️ עריכת קטגוריות משנה (${parentCategory || 'הכל'}):`;
      subcategories.forEach(s => {
        if (!parentCategory || s.parentCategory === parentCategory || !s.parentCategory) {
          itemsSet.add(s.name);
        }
      });
    }

    const items = Array.from(itemsSet);

    if (items.length === 0) {
      list.innerHTML = '<div class="text-xs text-gray-400 p-2 text-center">אין פריטים קיימים לעריכה</div>';
    } else {
      items.forEach((oldName, idx) => {
        const itemRow = document.createElement('div');
        itemRow.className = 'flex items-center gap-1.5 p-1.5 bg-amber-50/50 rounded-xl border border-amber-100';
        
        const input = document.createElement('input');
        input.type = 'text';
        input.id = `edit-item-input-${idx}`;
        input.value = oldName;
        input.className = 'flex-1 p-1.5 text-xs border border-gray-200 rounded-lg outline-none focus:border-indigo-500 bg-white';

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg transition whitespace-nowrap cursor-pointer';
        saveBtn.innerText = 'שמור';
        saveBtn.onclick = () => renameItem(type, oldName, input.value.trim());

        itemRow.appendChild(input);
        itemRow.appendChild(saveBtn);
        list.appendChild(itemRow);
      });
    }

    modal.classList.remove('hidden');
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
  }

  function renameItem(type, oldName, newName) {
    if (!newName) return alert('נא להזין שם תקין');
    if (oldName === newName) return alert('לא בוצע שינוי בשם');

    if (type === 'category') {
      categories = categories.map(c => c === oldName ? newName : c);
      subcategories = subcategories.map(s => s.parentCategory === oldName ? { ...s, parentCategory: newName } : s);
      tasks = tasks.map(t => t.category === oldName ? { ...t, category: newName } : t);
      if (activeCategory === oldName) activeCategory = newName;
    } else if (type === 'assignee') {
      assignees = assignees.map(a => a === oldName ? newName : a);
      tasks = tasks.map(t => t.assignee === oldName ? { ...t, assignee: newName } : t);
      if (activeAssignee === oldName) activeAssignee = newName;
    } else if (type === 'subcategory') {
      subcategories = subcategories.map(s => s.name === oldName ? { ...s, name: newName } : s);
      tasks = tasks.map(t => t.subcategory === oldName ? { ...t, subcategory: newName } : t);
      if (activeSubcategory === oldName) activeSubcategory = newName;
    }

    saveDataCloud();
    openEditModal(type);
  }

  /* --- מודאל מחיקה --- */
  function openDeleteModal(type) {
    currentDeleteType = type;
    const modal = document.getElementById('delete-modal');
    const list = document.getElementById('delete-modal-list');
    const title = document.getElementById('delete-modal-title');
    list.innerHTML = '';

    let itemsSet = new Set();

    if (type === 'category') {
      title.innerText = 'לחץ על קטגוריה ראשית למחיקה:';
      categories.forEach(c => itemsSet.add(c));
    } else if (type === 'assignee') {
      title.innerText = 'לחץ על אחראי/ת למחיקה:';
      assignees.forEach(a => itemsSet.add(a));
    } else if (type === 'subcategory') {
      const parentCategory = document.getElementById('task-category').value;
      title.innerText = `לחץ על קטגוריה למחיקה:`;
      subcategories.forEach(s => {
        if (!parentCategory || s.parentCategory === parentCategory || !s.parentCategory) {
          itemsSet.add(s.name);
        }
      });
    }

    const items = Array.from(itemsSet);

    if (items.length === 0) {
      list.innerHTML = '<div class="text-xs text-gray-400 p-2 text-center">אין פריטים ברשימה למחיקה</div>';
    } else {
      items.forEach(itemName => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full flex justify-between items-center p-2.5 rounded-xl bg-red-50 hover:bg-red-100 border border-red-100 text-red-700 text-xs font-bold transition text-right cursor-pointer';
        btn.innerHTML = `<span>${itemName}</span><span class="text-red-500 font-normal">🗑️ מחק</span>`;
        btn.onclick = () => deleteItemFromModal(type, itemName);
        list.appendChild(btn);
      });
    }

    modal.classList.remove('hidden');
  }

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.add('hidden');
  }

  function deleteItemFromModal(type, itemName) {
    if (confirm(`האם למחוק את "${itemName}" מכל המקומות?`)) {
      if (type === 'category') {
        categories = categories.filter(c => c !== itemName);
        subcategories = subcategories.filter(s => s.parentCategory !== itemName);
        tasks = tasks.filter(t => t.category !== itemName);
        if (activeCategory === itemName) activeCategory = 'הכל';
      } else if (type === 'assignee') {
        assignees = assignees.filter(a => a !== itemName);
        tasks = tasks.map(t => t.assignee === itemName ? { ...t, assignee: 'שנינו' } : t);
        if (activeAssignee === itemName) activeAssignee = 'הכל';
      } else if (type === 'subcategory') {
        subcategories = subcategories.filter(s => s.name !== itemName);
        tasks = tasks.filter(t => t.subcategory !== itemName);
        if (activeSubcategory === itemName) activeSubcategory = 'הכל';
      }

      saveDataCloud();
      openDeleteModal(type);
    }
  }

  function updateCategoryDropdown() {
    const sel = document.getElementById('task-category');
    if (!sel) return;
    const curVal = sel.value;
    sel.innerHTML = '';
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.innerText = c;
      sel.appendChild(opt);
    });
    
    sel.appendChild(new Option('➕ הוסף קטגוריה חדשה...', '__ADD_CAT__'));
    sel.appendChild(new Option('✏️ ערוך קטגוריות...', '__EDIT_CAT__'));
    sel.appendChild(new Option('🗑️ מחק קטגוריה...', '__DEL_CAT__'));

    if (categories.includes(curVal)) sel.value = curVal;
  }

  function onCategorySelectChange() {
    const val = document.getElementById('task-category').value;
    if (val === '__ADD_CAT__') openAddModal('category');
    else if (val === '__EDIT_CAT__') openEditModal('category');
    else if (val === '__DEL_CAT__') openDeleteModal('category');
    else updateSubcategoryDropdown();
  }

  function updateAssigneeDropdown() {
    const sel = document.getElementById('task-assignee');
    if (!sel) return;
    const curVal = sel.value;
    sel.innerHTML = '';
    assignees.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a;
      opt.innerText = a;
      sel.appendChild(opt);
    });
    
    sel.appendChild(new Option('➕ הוסף אחראי/ת...', '__ADD_ASS__'));
    sel.appendChild(new Option('✏️ ערוך אחראים...', '__EDIT_ASS__'));
    sel.appendChild(new Option('🗑️ מחק אחראי/ת...', '__DEL_ASS__'));

    if (assignees.includes(curVal)) sel.value = curVal;
  }

  function onAssigneeSelectChange() {
    const val = document.getElementById('task-assignee').value;
    if (val === '__ADD_ASS__') openAddModal('assignee');
    else if (val === '__EDIT_ASS__') openEditModal('assignee');
    else if (val === '__DEL_ASS__') openDeleteModal('assignee');
  }

  function updateSubcategoryDropdown() {
    const selectedCat = document.getElementById('task-category').value;
    const subSelect = document.getElementById('task-subcategory');
    subSelect.innerHTML = '<option value="כללי">כללי (ללא קטגוריה נוספת)</option>';

    const filteredSubs = subcategories.filter(s => s.parentCategory === selectedCat);
    filteredSubs.forEach(s => {
      subSelect.appendChild(new Option(s.name, s.name));
    });

    subSelect.appendChild(new Option('➕ הוסף קטגוריה חדשה...', '__ADD_SUB__'));
    subSelect.appendChild(new Option('✏️ ערוך קטגוריות...', '__EDIT_SUB__'));
    subSelect.appendChild(new Option('🗑️ מחק קטגוריה...', '__DEL_SUB__'));
  }

  function onSubcategorySelectChange() {
    const val = document.getElementById('task-subcategory').value;
    if (val === '__ADD_SUB__') openAddModal('subcategory');
    else if (val === '__EDIT_SUB__') openEditModal('subcategory');
    else if (val === '__DEL_SUB__') openDeleteModal('subcategory');
  }

  function createFilterButton(text, isActive, onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition cursor-pointer ${isActive ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`;
    btn.innerText = text;
    btn.onclick = onClick;
    return btn;
  }

  function renderCategoryFilterBar() {
    const bar = document.getElementById('category-filter-bar');
    if (!bar) return;
    bar.innerHTML = '';
    bar.appendChild(createFilterButton('הכל', activeCategory === 'הכל', () => setCategoryFilter('הכל')));
    bar.appendChild(createFilterButton('📅 עם תאריך', activeCategory === '📅 עם תאריך', () => setCategoryFilter('📅 עם תאריך')));
    categories.forEach(c => {
      bar.appendChild(createFilterButton(c, activeCategory === c, () => setCategoryFilter(c)));
    });
  }

  function renderAssigneeFilterBar() {
    const bar = document.getElementById('assignee-filter-bar');
    if (!bar) return;
    bar.innerHTML = '';

    const label = document.createElement('span');
    label.className = 'text-xs text-gray-400 pl-1 font-medium whitespace-nowrap';
    label.innerText = 'אחראי:';
    bar.appendChild(label);

    bar.appendChild(createFilterButton('הכל', activeAssignee === 'הכל', () => setAssigneeFilter('הכל')));
    assignees.forEach(a => {
      bar.appendChild(createFilterButton(a, activeAssignee === a, () => setAssigneeFilter(a)));
    });
  }

  function updateSubcategoryFilterBar() {
    const bar = document.getElementById('subcategory-filter-bar');
    const container = document.getElementById('subcategory-filter-buttons');
    if (!bar || !container) return;

    if (activeCategory === 'הכל' || activeCategory === '📅 עם תאריך') {
      bar.classList.add('hidden');
      activeSubcategory = 'הכל';
      return;
    }

    const availableSubs = subcategories.filter(s => s.parentCategory === activeCategory);
    if (availableSubs.length === 0) {
      bar.classList.add('hidden');
      activeSubcategory = 'הכל';
      return;
    }

    bar.classList.remove('hidden');
    container.innerHTML = '';
    container.appendChild(createFilterButton('הכל', activeSubcategory === 'הכל', () => setSubcategoryFilter('הכל')));
    container.appendChild(createFilterButton('כללי', activeSubcategory === 'כללי', () => setSubcategoryFilter('כללי')));
    availableSubs.forEach(s => {
      container.appendChild(createFilterButton(s.name, activeSubcategory === s.name, () => setSubcategoryFilter(s.name)));
    });
  }

  function setCategoryFilter(cat) {
    activeCategory = cat;
    activeSubcategory = 'הכל';
    renderCategoryFilterBar();
    updateSubcategoryFilterBar();
    render();
  }

  function setAssigneeFilter(ass) {
    activeAssignee = ass;
    renderAssigneeFilterBar();
    render();
  }

  function setSubcategoryFilter(sub) {
    activeSubcategory = sub;
    updateSubcategoryFilterBar();
    render();
  }

  function addTask() {
    const titleInput = document.getElementById('task-title');
    const title = titleInput.value.trim();
    if (!title) return alert('נא להזין טקסט למשימה');

    const category = document.getElementById('task-category').value;
    const assignee = document.getElementById('task-assignee').value;
    const subcategory = document.getElementById('task-subcategory').value || 'כללי';
    const enableDate = document.getElementById('task-enable-date').checked;

    let hebDateData = null;
    if (enableDate) {
      const day = parseInt(document.getElementById('task-heb-day').value, 10);
      const monthCode = parseFloat(document.getElementById('task-heb-month').value);
      const year = parseInt(document.getElementById('task-heb-year').value, 10);

      const mObj = HEBREW_MONTHS_LIST.find(m => m.code === monthCode) || HEBREW_MONTHS_LIST[0];
      const dayHeb = HEBREW_DAYS_LIST[day] || day + "'";
      const yearHeb = toHebrewYear(year);

      hebDateData = {
        day,
        monthCode,
        monthName: mObj.name,
        year,
        dateDisplay: `${dayHeb} ב${mObj.name} ${yearHeb}`,
        sortKey: Math.floor(year * 10000 + monthCode * 100 + day)
      };
    }

    const newTask = {
      id: Date.now().toString(),
      title,
      category,
      assignee,
      subcategory,
      completed: false,
      hebDate: hebDateData,
      createdAt: Date.now()
    };

    tasks.unshift(newTask);
    saveDataCloud();

    titleInput.value = '';
    document.getElementById('task-enable-date').checked = false;
    document.getElementById('task-date-picker-box').classList.add('hidden');
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveDataCloud();
  }

  function deleteTask(id) {
    if (confirm('האם למחוק את המשימה?')) {
      tasks = tasks.filter(t => t.id !== id);
      saveDataCloud();
    }
  }

  function render() {
    const container = document.getElementById('tasks-container');
    const todayBanner = document.getElementById('today-banner');
    const todayList = document.getElementById('today-tasks-list');
    const todayCount = document.getElementById('today-count');
    if (!container) return;

    // משימות להיום
    const todayTasks = tasks.filter(t => !t.completed && t.hebDate && t.hebDate.day === todayHeb.day && t.hebDate.monthCode === todayHeb.monthCode && t.hebDate.year === todayHeb.year);
    
    if (todayTasks.length > 0) {
      todayBanner.classList.remove('hidden');
      document.getElementById('today-date-text').innerText = todayHeb.dateDisplay;
      todayCount.innerText = todayTasks.length;
      todayList.innerHTML = '';
      todayTasks.forEach(t => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-white p-2 rounded-xl border border-amber-100 text-xs shadow-2xs';
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask('${t.id}')" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
            <span class="font-bold text-gray-800">${t.title}</span>
          </div>
          <span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">${t.assignee}</span>
        `;
        todayList.appendChild(item);
      });
    } else {
      todayBanner.classList.add('hidden');
    }

    // סינון כללי
    let filtered = tasks.filter(t => {
      if (activeCategory === '📅 עם תאריך') {
        if (!t.hebDate) return false;
      } else if (activeCategory !== 'הכל' && t.category !== activeCategory) {
        return false;
      }

      if (activeSubcategory !== 'הכל' && t.subcategory !== activeSubcategory) {
        return false;
      }

      if (activeAssignee !== 'הכל' && t.assignee !== activeAssignee) {
        return false;
      }

      return true;
    });

    container.innerHTML = '';

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-sm text-gray-400 text-sm">
          אין משימות להצגה כרגע 📋
        </div>
      `;
      return;
    }

    filtered.forEach(t => {
      const card = document.createElement('div');
      card.className = `bg-white rounded-2xl p-3.5 shadow-sm border transition flex items-center justify-between gap-3 ${t.completed ? 'opacity-60 bg-gray-50/80 border-gray-100' : 'border-gray-100 hover:border-indigo-100'}`;
      
      card.innerHTML = `
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask('${t.id}')" class="w-5 h-5 text-indigo-600 rounded cursor-pointer shrink-0">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-bold text-gray-800 truncate ${t.completed ? 'line-through text-gray-400' : ''}">${t.title}</div>
            <div class="flex flex-wrap items-center gap-1.5 mt-1 text-[10px]">
              <span class="bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded-full">${t.category}</span>
              ${t.subcategory && t.subcategory !== 'כללי' ? `<span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">${t.subcategory}</span>` : ''}
              <span class="bg-amber-50 text-amber-700 font-bold px-2 py-0.5 rounded-full">${t.assignee}</span>
              ${t.hebDate ? `<span class="bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-full">📅 ${t.hebDate.dateDisplay}</span>` : ''}
            </div>
          </div>
        </div>
        <button onclick="deleteTask('${t.id}')" class="text-gray-300 hover:text-red-500 p-1.5 transition cursor-pointer">🗑️</button>
      `;
      container.appendChild(card);
    });
  }

  // הפעלה ראשונית של האזנה לענן
  listenToCloudData();
</script>
</body>
</html>
